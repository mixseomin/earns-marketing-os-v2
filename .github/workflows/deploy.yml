name: Deploy MOS v2

on:
  push:
    branches: [main]
    # Hồ sơ phòng/nhân sự của cty (apps/cty/cong-ty/**) là DỮ LIỆU đọc lúc render, không phải tài liệu → vẫn deploy dù là .md.
    paths:
      - '**'
      - '!**/*.md'
      - 'apps/cty/cong-ty/**'
      - '!wiki/**'
      - '!decisions/**'
      - '!.gitignore'
  # Chạy tay: chọn ĐÚNG MỘT app (anh chốt 13/10/2026 — chạy tay không được dựng lại + khởi động lại cả repo). 'het' = như cũ.
  workflow_dispatch:
    inputs:
      app:
        description: 'App cần deploy'
        required: true
        type: choice
        options: [cty, web, store, xuong-video, het]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Build on GitHub-hosted runner (7GB RAM, clean) instead of as.on.tc self-hosted
# (CX22 4GB, swap-thrashing → next build OOM SIGKILL → wiped .next/static/, served
# HTML referencing dead CSS hashes; incident 2026-06-28). Server still runs migrations,
# deps install, and `next start` — only the build moved.
# Một job duy nhất (build + gửi + deploy): bỏ khởi động job thứ hai + tải lên/tải về artifact (~10s). Đo 11/10/2026.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # cần lịch sử để so before..sha khi chọn app phải build
      # Chỉ build app có thay đổi (anh chốt 11/10/2026): lượt chỉ sửa cty từ ~4 phút còn ~1,5 phút. Không xác định được khoảng
      # thay đổi (nhánh mới, chạy tay, đổi chính workflow) → build HẾT. web = mọi thay đổi nằm ngoài 3 app con (packages, scripts,
      # deploy.sh, lockfile…) — khớp điều kiện WEB_CHANGED/DEPS_CHANGED của deploy.sh nên box không bao giờ phải tự build web.
      - name: Chọn app cần build
        id: chon
        run: |
          B="${{ github.event.before }}"
          A="${{ inputs.app }}"
          # Chạy tay một app: chỉ dựng app đó, máy chủ chỉ thay + khởi động lại app đó (web chỉ khi chọn web).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$A" ] && [ "$A" != "het" ]; then
            case "$A" in xuong-video) echo "studio=1" ;; *) echo "$A=1" ;; esac >> "$GITHUB_OUTPUT"; cat "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$B" ] || [ "$B" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$B^{commit}" 2>/dev/null; then
            F="__HET__"
          else
            F=$(git diff --name-only "$B" "${{ github.sha }}")
            echo "$F" | grep -q '^\.github/workflows/' && F="__HET__"
          fi
          co() { [ "$F" = "__HET__" ] || echo "$F" | grep -qE "$1"; }
          # App con bị chạm = tệp trong app, trong packages/* mà package.json của app phụ thuộc (@mos2/*), hoặc lockfile — scripts/app-cham.mjs
          # đọc phụ thuộc từ package.json (danh sách gõ tay ở đây từng thiếu packages/bang → sửa bảng dùng chung mà studio không dựng lại).
          cham() { [ "$F" = "__HET__" ] || echo "$F" | node scripts/app-cham.mjs "$@"; }
          cham apps/store && echo "store=1" >> "$GITHUB_OUTPUT"
          cham apps/xuong-video && echo "studio=1" >> "$GITHUB_OUTPUT"
          # cong-ty/** chỉ là dữ liệu đọc lúc render: máy chủ git pull là đủ, không dựng lại cty.
          cham apps/cty --tru apps/cty/cong-ty/ && echo "cty=1" >> "$GITHUB_OUTPUT"
          co '^apps/cty/cong-ty/' && echo "cty_du_lieu=1" >> "$GITHUB_OUTPUT"
          # deploy.sh + deploy/ chỉ chạy trên máy chủ, không vào bản build → không kéo build web (38s).
          if [ "$F" = "__HET__" ] || echo "$F" | grep -vqE '^(apps/(store|xuong-video|cty)/|packages/gop-y/|deploy/|deploy\.sh$)'; then echo "web=1" >> "$GITHUB_OUTPUT"; fi
          echo "Tệp đổi:"; echo "$F" | head -40; echo "Build:"; cat "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: '22' }   # match server node v22 (.next swapped in raw) + Node 20 is GHA-deprecated
      # node_modules theo lockfile: trúng cache thì bỏ hẳn npm ci (14s → ~5s khôi phục).
      - name: Restore node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.nm.outputs.cache-hit != 'true'
      # Next.js incremental build cache cho CẢ 4 app (trước chỉ web → store/studio/cty build nguội mỗi lượt).
      # Keyed per-sha, restore-keys falls back to the newest.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/store/.next/cache
            apps/xuong-video/.next/cache
            apps/cty/.next/cache
          key: nextcache4-${{ github.sha }}
          restore-keys: nextcache4-
      - name: Kiểm tĩnh
        run: |
          node scripts/check-sql-aliases.mjs
          node scripts/check-replace-state.mjs
          node scripts/check-canon.mjs
          node scripts/check-gop-y-surface.mjs
          node scripts/check-etp-gop-y.mjs --tu-kiem && node scripts/check-etp-gop-y.mjs
          node scripts/check-ethopex-cong.mjs --tu-kiem && node scripts/check-ethopex-cong.mjs
          node scripts/check-mos2-host.mjs --tu-kiem && node scripts/check-mos2-host.mjs
          node scripts/check-tab-trang.mjs --tu-kiem && node scripts/check-tab-trang.mjs
          node scripts/check-client-db.mjs --tu-kiem && node scripts/check-client-db.mjs
      # Công ty AI: hồ sơ phòng/nhân sự + worker tự kiểm trước khi dựng.
      - run: node apps/cty/scripts/tu-kiem.mjs && node apps/cty/scripts/fm.mjs --tu-kiem && node apps/cty/worker/gia.mjs --tu-kiem && node apps/cty/worker/log.mjs --tu-kiem && node apps/cty/worker/proxy.mjs --tu-kiem && node apps/cty/worker/ca.mjs --tu-kiem && node apps/cty/scripts/thu-ngan.mjs && node apps/cty/worker/quy-trinh.mjs --tu-kiem && node apps/cty/worker/cai-tien.mjs --tu-kiem
        if: steps.chon.outputs.cty == '1' || steps.chon.outputs.cty_du_lieu == '1'
      # Dựng SONG SONG các app được chọn (runner repo công khai: 4 nhân, 16GB) — trước dựng nối đuôi web 41s + store 21s
      # + studio 22s + cty 21s. Mỗi app một tarball <app>.tar.gz; app không dựng lượt này máy chủ giữ nguyên bản đang chạy.
      - name: Build (song song)
        run: |
          dung() { ( npm run build --workspace="apps/$1" > "/tmp/build-$1.log" 2>&1 && tar -C "apps/$1" --exclude='.next/cache' -czf "$1.tar.gz" .next; echo $? > "/tmp/build-$1.rc" ) & }
          if [ "${{ steps.chon.outputs.web }}" = 1 ]; then dung web; fi
          if [ "${{ steps.chon.outputs.store }}" = 1 ]; then dung store; fi
          if [ "${{ steps.chon.outputs.studio }}" = 1 ]; then dung xuong-video; fi
          if [ "${{ steps.chon.outputs.cty }}" = 1 ]; then dung cty; fi
          wait
          sai=0
          for rc in /tmp/build-*.rc; do
            [ -f "$rc" ] || continue
            a=$(basename "$rc" .rc); a=${a#build-}
            echo "::group::build $a"; cat "/tmp/build-$a.log"; echo "::endgroup::"
            [ "$(cat "$rc")" = 0 ] && echo "✓ $a" || { echo "::error::build $a lỗi — xem nhóm log 'build $a'"; sai=1; }
          done
          exit $sai
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      # Gửi + bung + deploy trong MỘT phiên ssh. Lượt không dựng app nào (chỉ sửa deploy.sh/deploy/) thì không có tarball.
      # Tarball + chỗ bung ở /var/tmp/mos2-deploy (đĩa), KHÔNG /tmp: /tmp của box3 là tmpfs 512M, các phiên khác hay lấp đầy → deploy hỏng "No space left" (26/10/2026).
      - name: Ship + server-side deploy (migrations + swap + restart)
        run: |
          if ls *.tar.gz >/dev/null 2>&1; then ls -la *.tar.gz; ssh -i ~/.ssh/id_ed25519 root@${{ secrets.DEPLOY_HOST }} "mkdir -p /var/tmp/mos2-deploy"; scp -i ~/.ssh/id_ed25519 *.tar.gz root@${{ secrets.DEPLOY_HOST }}:/var/tmp/mos2-deploy/; else echo "↺ không app nào dựng lượt này"; fi
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.DEPLOY_HOST }} '
            set -e
            for a in web store xuong-video cty; do
              [ -f "/var/tmp/mos2-deploy/$a.tar.gz" ] || { echo "↺ $a: không build lượt này"; continue; }
              mkdir -p "/opt/earns-marketing-os-v2/apps/$a" && cd "/opt/earns-marketing-os-v2/apps/$a"
              B="/var/tmp/mos2-deploy/b-$a"
              rm -rf .next.new "$B" && mkdir -p .next.new "$B"
              tar -xzf "/var/tmp/mos2-deploy/$a.tar.gz" -C "$B/"
              mv "$B/.next/"* .next.new/
              rm -rf "$B" "/var/tmp/mos2-deploy/$a.tar.gz"
              echo "✓ $a: đã gửi bản mới"
            done
            SKIP_BUILD=1 /opt/earns-marketing-os-v2/deploy.sh
          '

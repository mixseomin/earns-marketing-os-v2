# vpthu.on.tc — Văn phòng pixel RIÊNG Phòng thử (pixel-agents :3863, HOME riêng, mos2-vp.service). pixel-agents không có đăng nhập và ai vào cũng
# ghi đè được layout/ghế qua WebSocket, nên chặn ở cửa: nginx auth_request hỏi cty.on.tc (/api/phien, cookie mos2-session .on.tc
# dùng chung) — 204 mới cho qua, 401 → đẩy sang mos2.on.tc/login. /ws là WebSocket; pixel-agents kiểm Origin == Host nên giữ nguyên Host.
server { listen 80; server_name vpthu.on.tc; return 301 https://$host$request_uri; }
server {
  listen 443 ssl; http2 on;
  server_name vpthu.on.tc;
  include snippets/cloudflare-allow.conf;
  ssl_certificate /etc/letsencrypt/live/on.tc/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/on.tc/privkey.pem;

  location = /_phien {
    internal;
    proxy_pass http://127.0.0.1:3860/api/phien;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host cty.on.tc;
  }
  error_page 401 = @login;
  location @login { return 302 https://mos2.on.tc/login?next=https://vpthu.on.tc/; }

  # Cảm ứng cho điện thoại: chèn deploy/vp-touch-pan.js vào index.html (sub_filter cần body không nén → tắt Accept-Encoding tới upstream).
  location = /vp-touch-pan.js { alias /opt/earns-marketing-os-v2/deploy/vp-touch-pan.js; default_type application/javascript; add_header Cache-Control "no-cache"; }

  location / {
    auth_request /_phien;
    proxy_pass http://127.0.0.1:3863;
    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<script src="/vp-touch-pan.js"></script></head>';
    sub_filter_once on;
    sub_filter_types text/html;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
}

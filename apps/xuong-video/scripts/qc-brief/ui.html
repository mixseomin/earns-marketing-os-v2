<!doctype html>
<!-- MẪU "UI PROMO" cho kênh AngleBrief (anh 19/11/2026; mẫu gốc: Prompt Opus 5.5 › annacher-433425 — quảng bá dựng từ GIAO DIỆN THẬT: một khối hình không bao giờ cắt,
     mỗi trạng thái là chính khối đó đổi cỡ / bo góc / màu, nội dung đổi bằng một nhịp nhoè ngắn; con trỏ bấm thật; camera phóng theo chỗ bấm; khung cuối = khung đầu để lặp).
     Nội dung = ảnh chụp thật anglebrief.net (qc-brief/chup-site.mjs): trang chủ → /reports → báo cáo mẫu /r/meal-kit → nút mua. Toạ độ chỗ bấm = toạ độ thật của nút
     trên ảnh chụp (px ảnh, 2,5 × css). Hợp đồng quay: window.CAU → await __dung() → __seek(t) thuần theo t. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: AB; src: url(../../public/fonts/ArchivoBlack-Regular.ttf); }
@font-face { font-family: M; src: url(../../public/fonts/Montserrat-ExtraBold.ttf); font-weight: 800; }
* { margin: 0; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d'), W = 1080, H = 1920;
const XAM = '#E9E6E1', MUC = '#111', CAM = '#FF5B1F';
let C, IMG = {}, KHOI = [], TRO = [];
const kep = (v) => Math.max(0, Math.min(1, v)), mem = (v) => { v = kep(v); return v < 0.5 ? 4 * v ** 3 : 1 - (-2 * v + 2) ** 3 / 2; };
// lò xo có vượt rất nhẹ (luật mẫu gốc: "springs everywhere, a tiny overshoot at most")
const lo = (v) => { v = kep(v); return 1 - Math.exp(-6.5 * v) * Math.cos(7.5 * v) * (1 - v) - (v === 1 ? 0 : 0); };
const tai = (u) => new Promise((ok, loi) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => loi(new Error('không tải được ' + u)); i.src = u; });
// KHỐI mỗi loại cảnh (khối DUY NHẤT, chỉ đổi hình học)
const HINH = { vien: { x: 70, y: 810, w: 940, h: 300, r: 150, mau: '#fff' }, trang: { x: 110, y: 190, w: 860, h: 1540, r: 56, mau: '#fff' },
  nut: { x: 160, y: 875, w: 760, h: 170, r: 85, mau: CAM }, ket: { x: 190, y: 610, w: 700, h: 700, r: 120, mau: '#fff' } };
const SC = 860 / 1075;   // ảnh chụp rộng 1075 px → khung trang rộng 860
const toaDo = (s, p, cuon) => { const h = HINH.trang; return { x: h.x + (p[0] + p[2] / 2) * SC, y: h.y + (p[1] + p[3] / 2 - cuon) * SC }; };
const cuonCua = (s, q) => { const [a, b] = s.c.cuon || [0, 0], het = (s.c.bam_luc ?? (s.kt - s.bd)) - 0.45; return a + (b - a) * mem((q - 0.35) / Math.max(0.4, het - 0.35)); };

window.__dung = async () => { C = window.CAU; await document.fonts.load('80px AB'); await document.fonts.load('800 40px M'); for (const [k, u] of Object.entries(C.anh)) IMG[k] = await tai(u);
  // đường con trỏ: điểm đích từng cảnh (chỗ bấm thật, đã trừ cuộn lúc bấm); cảnh không bấm giữ điểm cũ
  let truoc = { x: 1180, y: 2100 };
  for (const s of C.canh) { let den = truoc;
    if (s.c.bam) den = toaDo(s, s.c.bam, cuonCua(s, s.c.bam_luc));
    else if (s.c.loai === 'nut') den = { x: 540 + 150, y: 960 + 20 }; else if (s.c.loai === 'ket') den = { x: 1180, y: 2100 };
    TRO.push({ tu: truoc, den }); truoc = den; } };
function hop(px, py, w, h, r) { x.beginPath(); x.roundRect(px, py, w, h, Math.min(r, w / 2, h / 2)); }
const tron = (a, b, p) => a + (b - a) * p;
function khoiLuc(k, q) { const s = C.canh[k], h = HINH[s.c.loai], tr = k ? HINH[C.canh[k - 1].c.loai] : h, p = lo(q / 0.55);
  return { x: tron(tr.x, h.x, p), y: tron(tr.y, h.y, p), w: tron(tr.w, h.w, p), h: tron(tr.h, h.h, p), r: tron(tr.r, h.r, p), mau: p > 0.5 ? h.mau : tr.mau }; }
function noiDung(s, q, b) {
  const L = s.c.loai;
  if (L === 'trang') { const a = IMG[s.c.anh], cu = cuonCua(s, q); x.drawImage(a, 0, cu, a.width, Math.min(a.height - cu, b.h / SC), b.x, b.y, b.w, Math.min(a.height - cu, b.h / SC) * SC);
    if (s.c.bam) { const p = q - s.c.bam_luc; if (p > -0.05 && p < 0.6) { const d = toaDo(s, s.c.bam, cu), [, , w, h] = s.c.bam; x.save(); x.strokeStyle = CAM; x.lineWidth = 6; x.globalAlpha = 1 - kep(p / 0.6); hop(d.x - (w * SC) / 2 - 8, d.y - (h * SC) / 2 - 8, w * SC + 16, h * SC + 16, 30); x.stroke(); x.restore(); } } }
  x.textAlign = 'center';
  if (L === 'vien') { x.fillStyle = MUC; x.font = '64px AB'; const [a, b2] = s.c.chu.split('|'); x.fillText(a, b.x + b.w / 2, b.y + b.h / 2 - 8); x.fillStyle = CAM; x.fillText(b2 || '', b.x + b.w / 2, b.y + b.h / 2 + 70); }
  if (L === 'nut') { const xong = q > s.c.bam_luc + 0.15; x.fillStyle = '#fff'; x.font = '800 60px M'; x.fillText(xong ? s.c.sau : s.c.chu, b.x + b.w / 2, b.y + b.h / 2 + 22); }
  if (L === 'ket') { x.fillStyle = CAM; hop(b.x + b.w / 2 - 90, b.y + 150, 180, 180, 44); x.fill(); x.fillStyle = '#fff'; x.font = '140px AB'; x.fillText('A', b.x + b.w / 2, b.y + 292);
    x.fillStyle = MUC; x.font = '96px AB'; x.fillText(s.c.chu, b.x + b.w / 2, b.y + 470); x.font = '800 48px M'; x.fillStyle = '#666'; x.fillText(s.c.url, b.x + b.w / 2, b.y + 560); }
  x.textAlign = 'left';
}
function conTro(px, py, bam) { const k = 1 - 0.18 * bam; x.save(); x.translate(px, py); x.scale(k * 1.6, k * 1.6); x.shadowColor = 'rgba(0,0,0,.3)'; x.shadowBlur = 12; x.shadowOffsetY = 4;
  x.fillStyle = '#111'; x.strokeStyle = '#fff'; x.lineWidth = 3; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 34); x.lineTo(9, 26); x.lineTo(16, 41); x.lineTo(22, 38); x.lineTo(15, 23); x.lineTo(27, 23); x.closePath(); x.fill(); x.stroke(); x.restore(); }

window.__seek = (t) => {
  const k = Math.max(0, C.canh.findIndex((s, i) => t >= s.bd && t < (C.canh[i + 1]?.bd ?? 1e9))), s = C.canh[k], q = t - s.bd;
  // CAMERA: phóng nhẹ về chỗ bấm quanh lúc bấm (một hình thang mềm), không cắt
  const tro = TRO[k], bamLuc = s.c.bam_luc ?? null, diTho = bamLuc != null ? mem((q - 0.3) / Math.max(0.3, bamLuc - 0.55)) : mem((q - 0.1) / 0.6);
  const cx = tron(tro.tu.x, tro.den.x, diTho), cy = tron(tro.tu.y, tro.den.y, diTho);
  const zoom = bamLuc != null ? 1 + 0.12 * Math.max(0, 1 - Math.abs(q - bamLuc) / 0.7) : 1;
  x.fillStyle = XAM; x.fillRect(0, 0, W, H);
  x.save(); x.translate(cx, cy); x.scale(zoom, zoom); x.translate(-cx, -cy);
  const b = khoiLuc(k, q); x.save(); x.shadowColor = 'rgba(0,0,0,.16)'; x.shadowBlur = 60; x.shadowOffsetY = 24; x.fillStyle = b.mau; hop(b.x, b.y, b.w, b.h, b.r); x.fill(); x.restore();
  // nội dung trong khối: đổi bằng nhịp nhoè ngắn đầu cảnh
  x.save(); hop(b.x, b.y, b.w, b.h, b.r); x.clip(); const nhoe = q < 0.3 ? (1 - q / 0.3) * 14 : 0; if (nhoe > 0.5) x.filter = `blur(${nhoe.toFixed(1)}px)`; x.globalAlpha = kep(q / 0.2); noiDung(s, q, b); x.restore();
  x.restore();
  const bam = bamLuc != null ? Math.max(0, 1 - Math.abs(q - bamLuc) / 0.12) : 0;
  if (!(s.c.loai === 'ket' && q > 0.6) && !(k === 0 && q < 0.4)) conTro(cx, cy, bam);
  if (bam > 0) { x.save(); x.strokeStyle = 'rgba(255,91,31,.6)'; x.lineWidth = 5; x.beginPath(); x.arc(cx, cy, 30 + (q - bamLuc + 0.12) * 260, 0, 7); x.stroke(); x.restore(); }
};
window.__khung = () => c.toDataURL('image/jpeg', 0.92).split(',')[1];
</script></body></html>

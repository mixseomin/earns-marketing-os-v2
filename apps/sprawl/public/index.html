<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sprawl · Tokyo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23180608'/><rect x='5' y='14' width='5' height='14' fill='%23ff2a3a'/><rect x='12' y='4' width='7' height='24' fill='%23ffb35c'/><rect x='21' y='10' width='6' height='18' fill='%239ee0ff'/></svg>">
<link rel="stylesheet" href="sprawl.css?v=__BAN__">
</head>
<body>
<canvas id="c"></canvas>
<div id="nap">Đang tải nhà Shinjuku từ PLATEAU…</div>
<header class="o tren"><b>Sprawl</b> <span>Tokyo · Shinjuku</span></header>
<aside class="o ben">
  <div id="kieu" class="hang"></div>
  <div class="hang">
    <button id="b-di" disabled title="Đứng xuống mặt đất ngay giữa màn hình (Enter)">🚶 Đi bộ</button>
    <button id="b-bay" style="display:none" title="Thôi đi bộ, bay lên toàn cảnh (Esc)">🛸 Bay</button>
    <button id="b-gy" title="Góp ý / báo lỗi">💬</button>
  </div>
  <p class="goiy">Bay: kéo chuột trái để dời, chuột phải để xoay, lăn để gần xa. Đi bộ: <b>WASD</b>, <b>Shift</b> chạy, <b>Space</b> nhảy / leo, <b>V</b> đổi góc nhìn, <b>Esc</b> bay lên.</p>
  <div id="tt" class="mo"></div>
</aside>
<div id="nguon" class="o">Nhà 3D: <a href="https://www.mlit.go.jp/plateau/" target="_blank" rel="noopener">Project PLATEAU</a> (Bộ Đất đai, Hạ tầng, Giao thông và Du lịch Nhật Bản) · người: Quaternius (CC0)</div>
<script>
// nạp theo dấu phiên bản (khuôn castle neuschwanstein.html): Cloudflare zone on.tc giữ .js 30 ngày → hỏi ETag rồi nạp ./x.js?v=<ETag>
(async () => {
  const TEP = ['sprawl.js', 'redspires.js', 'chung/dibo.js', 'chung/nguoi3d.js', 'chung/camung.js', 'chung/gopy.js'];
  const lay = (f) => fetch(`./${f}?ban=${Date.now()}`, { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' })
    .then((r) => (r.ok && (r.headers.get('etag') || r.headers.get('last-modified')) || '').replace(/[^\w-]/g, '')).catch(() => '');
  const dau = await Promise.all(TEP.map(lay));
  const imports = {
    three: 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js',
    'three/addons/': 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/',
    rapier: 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js',
    '3d-tiles-renderer/three': 'https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.3/build/index.three.js',
    '3d-tiles-renderer/three/plugins': 'https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.3/build/index.three-plugins.js',
  };
  TEP.forEach((f, i) => { imports[new URL(`./${f}`, location.href).href] = `./${f}?v=${dau[i] || Date.now()}`; });
  const m = document.createElement('script'); m.type = 'importmap'; m.textContent = JSON.stringify({ imports }); document.head.appendChild(m);
  const s = document.createElement('script'); s.type = 'module'; s.src = imports[new URL('./sprawl.js', location.href).href]; document.body.appendChild(s);
  addEventListener('error', (e) => { const n = document.getElementById('nap'); if (n && n.style.display !== 'none') n.textContent = 'Lỗi khi dựng: ' + (e.message || e.error); });
  addEventListener('unhandledrejection', (e) => { const n = document.getElementById('nap'); if (n && n.style.display !== 'none') n.textContent = 'Lỗi khi dựng: ' + (e.reason?.message || e.reason); });
})();
</script>
</body>
</html>

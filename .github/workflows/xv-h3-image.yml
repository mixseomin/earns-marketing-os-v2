# Image máy thuê H3 (apps/xuong-video/scripts/h3/) → ghcr.io/mixseomin/xv-h3. Build → KIỂM 0đ trong image (thu-0d.sh, CPU) → đạt mới đẩy :latest.
# Lý do (anh 16/11/2026): mọi lỗi script phải lộ ra ở đây (0đ), không phải sau khi đã trả tiền thuê GPU.
name: xv-h3 image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/xuong-video/scripts/h3/**', '.github/workflows/xv-h3-image.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dọn đĩa runner (image PyTorch CUDA 13 ~8GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/xuong-video/scripts/h3
          file: apps/xuong-video/scripts/h3/may/Dockerfile
          load: true
          tags: xv-h3:thu
      - name: Kiểm 0đ trong image (cài, đồ thị H3, lấy đúng clip)
        run: docker run --rm xv-h3:thu bash /root/h3/thu-0d.sh
      - name: Đẩy image (chỉ khi kiểm đạt)
        run: |
          docker tag xv-h3:thu ghcr.io/mixseomin/xv-h3:latest
          docker tag xv-h3:thu ghcr.io/mixseomin/xv-h3:${GITHUB_SHA::7}
          docker push ghcr.io/mixseomin/xv-h3:latest && docker push ghcr.io/mixseomin/xv-h3:${GITHUB_SHA::7}

<!doctype html>
<!-- HỐ ĐEN — shader thuần, 0₫ (anh 04/11/2026: "video kiểu này dạng code mà không gọi AI"). Máy quay lao từ xa vào hố đen: tinh vân xanh xoáy dần
     vào tâm, đĩa bồi tụ cam quay, tia sáng bẻ cong quanh bóng đen; càng gần càng ngả cam. Quay bằng vu-tru/quay.mjs; mở thẳng trong trình duyệt để xem. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 540), H = +(q.get('h') || 960);
const c = document.getElementById('c'); c.width = W; c.height = H;
const gl = c.getContext('webgl2', { preserveDrawingBuffer: true });
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
window.GPU = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

const FS = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T;
out vec4 o;
#define GIAY 10.
float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + 1.), f.x), f.y); }
float fbm(vec2 p){ float s = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 6; i++) { s += a * n(p); p = m * p; a *= .5; } return s; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

// tinh vân: nhiễu cuộn (domain warp) + sợi sáng dạng gờ
vec3 tinhVan(vec2 p, float cam){
  vec2 w = vec2(fbm(p * 2.2 + 3.1), fbm(p * 2.2 - 7.4));
  float d = fbm(p * 2.6 + w * 1.6);
  float soi = pow(1. - abs(2. * fbm(p * 5.5 + w * 2.2) - 1.), 4.) * .7;
  float xop = pow(fbm(p * 9. + w * 3.), 2.) * 1.6;                       // mây xốp lổn nhổn (không thành tia sét)
  float may = smoothstep(.35, .85, d) * (.55 + .45 * xop);
  vec3 xanh = vec3(.01, .03, .09) + vec3(.05, .22, .55) * may + vec3(.35, .7, 1.2) * soi * may * 1.6 + vec3(.9, .95, 1.) * pow(soi * may, 3.) * 2.;
  vec3 lua = vec3(.06, .015, 0.) + vec3(.6, .18, .02) * may + vec3(1.4, .6, .12) * soi * may * 1.6 + vec3(1., .9, .6) * pow(soi * may, 3.) * 2.;
  return mix(xanh, lua, cam);
}
// hạt: sao xa + tàn lửa, lưới băm (mỗi ô một hạt, nhấp nháy)
float hat(vec2 p, float co, float nguong){
  vec2 g = p * co, i = floor(g), f = fract(g) - .5;
  float r = h(i); if (r < nguong) return 0.;
  vec2 lech = vec2(h(i + 7.), h(i + 3.)) - .5;
  float d = length(f - lech * .6);
  return smoothstep(.09, 0., d) * (.5 + .5 * sin(T * 3. + r * 40.));
}

void main(){
  vec2 uv = (gl_FragCoord.xy - .5 * R) / R.x;              // dọc 9:16: x ∈ [-.5,.5]
  float u = clamp(T / GIAY, 0., 1.);
  float lao = smoothstep(.12, 1., u);                       // giây đầu trôi chậm, rồi lao vào
  vec2 tam = mix(vec2(.06, .2), vec2(0., .04), smoothstep(0., .75, u));
  float zoom = exp(mix(0., 1.75, lao * lao));
  vec2 p = rot(mix(-.45, -.1, lao)) * (uv - tam) / zoom;   // đĩa nghiêng chéo như ảnh đầu, xoay dần về ngang
  float rs = .055;                                          // bán kính bóng đen
  float r = length(p);

  // bẻ cong tia sáng nền quanh bóng + xoáy hút vào tâm (càng gần càng mạnh)
  vec2 bp = p * (1. + rs * rs * 2.2 / max(r * r, 1e-5));
  float xoay = .9 * rs / (r + .03) * (1. + 2.5 * lao) + T * .06;
  bp = rot(xoay) * bp;
  float camGan = clamp(exp(-r / (rs * 6.)) * (.5 + lao) + lao * lao * .7, 0., 1.);
  vec3 col = tinhVan(bp * 2.2 + vec2(1.3, .4), camGan);
  col += vec3(.9, .95, 1.) * hat(bp + T * .002, 90., .985) * .8;

  // đĩa bồi tụ (mặt phẳng nghiêng, càng gần càng lộ mặt)
  float nghieng = mix(.32, .62, lao);
  vec2 d = vec2(p.x, p.y / nghieng);
  float rd = length(d);
  float xoan = 3.2 * log(rd / rs) - T * 1.6;
  vec2 dir = normalize(rot(xoan) * d);
  float tho = fbm(dir * 2.6 + vec2(0., rd / rs * 3.6)) ;
  tho = pow(smoothstep(.25, .85, tho), 1.4);
  float bang = smoothstep(rs * 1.25, rs * 1.7, rd) * exp(-max(rd - rs * 1.7, 0.) / (rs * (1.5 + 2.5 * lao)));
  float doppler = 1. + .55 * normalize(d).x;
  vec3 mauDia = mix(vec3(1.2, .32, .03), vec3(1.6, 1.15, .6), smoothstep(rs * 2.6, rs * 1.5, rd));
  vec3 dia = mauDia * bang * (.35 + 1.6 * tho) * doppler * 1.6;
  dia += vec3(1.6, .7, .15) * hat(dir * (rd / rs) * .9 + T * .02, 6., .9) * bang * 1.5;   // tàn lửa trong đĩa

  // cung sáng của nửa đĩa phía sau, bị bẻ vòng lên trên bóng
  float cung = smoothstep(rs * 1.02, rs * 1.18, r) * exp(-max(r - rs * 1.18, 0.) / (rs * .45)) * smoothstep(-.35, .55, p.y / max(r, 1e-5));
  vec2 dc = normalize(rot(3.2 * log(r / rs) - T * 1.6) * p);
  vec3 cungMau = vec3(1.4, .62, .12) * cung * (.5 + 1.3 * pow(smoothstep(.25, .85, fbm(dc * 2.6 + vec2(0., r / rs * 3.6))), 1.4));
  float vong = exp(-pow((r - rs * 1.04) / (rs * .035), 2.));             // vành photon mỏng

  col += vec3(.8, .3, .05) * exp(-r / (rs * 3.)) * .25 * (.4 + lao);
  float bong = smoothstep(rs * 1.0, rs * .93, r);
  col = col * (1. - bong) + cungMau * (1. - bong) + vec3(1.5, 1.05, .6) * vong;
  float truoc = step(p.y, 0.);                                           // nửa đĩa trước đè lên bóng
  col = mix(col + dia * (1. - bong), col + dia, truoc);

  // tối viền + nén sáng
  col *= 1. - .35 * dot(uv, uv);
  col = 1. - exp(-col * 1.25);
  col = pow(col, vec3(.92));
  o = vec4(col, 1.);
}`;
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const la = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 2, gl.FLOAT, false, 0, 0);
const uR = gl.getUniformLocation(pr, 'R'), uT = gl.getUniformLocation(pr, 'T');
gl.viewport(0, 0, W, H);
window.ve = (t) => { gl.uniform2f(uR, W, H); gl.uniform1f(uT, t); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish(); };
window.ve(0); window.SAN_SANG = true;
if (!q.has('w')) { const t0 = performance.now(); (function lap() { window.ve(((performance.now() - t0) / 1000) % 10); requestAnimationFrame(lap); })(); }
</script></body></html>

<!doctype html>
<!-- tra-repo-ok: trang vẽ lại bản ghi của tran.mjs cho dung.mjs (window.__dung / __seek / __khung) — cùng khuôn vat-ly.html -->
<!-- Khuôn dọc (reel 1080×1920): tự bật khi khung nhìn cao hơn rộng (dung.mjs --rong 1080 --cao 1920) — sân thu vừa bề ngang, bảng tỷ số + danh sách bàn thắng ở trên, băng sự cố bám theo sân, màn tiêu đề / nghỉ / hết trận dời xuống giữa.
     Khung 1920×1080: sân tròn giữa màn, bảng tỷ số kiểu truyền hình trên đầu, hai cột đội hai bên (cầu thủ + bàn thắng), băng GOAL khi có bàn. Mọi thứ là hàm thuần của t. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#04070a;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = innerWidth, H = innerHeight; cv.width = W; cv.height = H;
const VW = 1920, VH = 1080;   // khung THẾ GIỚI (toạ độ tran.mjs) — W/H là khung MÀN
const DOC = H > W, S = DOC ? 1.18 : 1, FY = DOC ? 1010 : 540;   // reel: sân thu S lần, tâm sân ở y=FY
const YS = (y) => (DOC ? Math.round(FY + (y - VH / 2) * S) : y);   // băng bám theo sân: giữ đúng vị trí so với sân như bản ngang
const DY = DOC ? (H - VH) / 2 : 0;   // màn phủ kín (tiêu đề / nghỉ / hết trận): dời cả khối xuống giữa màn dọc
const chuVua = (txt, w, px, max) => { g.font = `${w} ${px}px ${FONT}`; const m = g.measureText(txt).width; if (m > max) g.font = `${w} ${Math.floor(px * max / m)}px ${FONT}`; };
const FONT = '"Barlow Condensed", "Helvetica Neue", Arial, sans-serif';   // Barlow Condensed (OFL, font/) — chữ kiểu đồ hoạ truyền hình
let G, L, BI = 10, FPS = 30, BAN = [], COI = [], EVF = [], NEN = null, THE = [], LOI = [], TIM = [], THEM = [], BAO = [], REP = [];
let THAY = [], CANG = [], VAR = [], VKQ = [], VDONG = [], DAU = [], TROI = 'ngay';
const TEN_TROI = { ngay: 'CLEAR SKY', dem: 'NIGHT GAME', mua: 'HEAVY RAIN', tuyet: 'SNOW', suong: 'FOG' };
// thay người: người vào nhận đúng thân người ra lúc người ra tới bàn trọng tài thứ tư
const doiLuc = (e) => e.t + (e.di ? e.di + 0.5 : 0);
const nguoi = (i, t) => { const c = G.ct[i]; let so = c?.so, ten = c?.ten, vao = null; for (const e of THAY) if (e.i === i && doiLuc(e) <= t) { so = e.vaoSo; ten = e.vaoTen; vao = e; } return { so, ten, vao }; };
const phutLuc = (t) => { const k = G.khung[Math.min(G.khung.length - 1, Math.round(t * FPS))]; return phutTxt(k.m, k.h ?? 1); };

const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }

window.__dung = async () => {
  G = window.CAU; L = G.luat; FPS = L.fps; BI = G.bi ?? G.ct.length;
  BAN = G.suKien.filter((e) => e.k === 'ban'); COI = G.suKien.filter((e) => e.k === 'coi');
  const loc = (k) => G.suKien.filter((e) => e.k === k);
  THE = loc('the'); LOI = loc('loi'); TIM = loc('tim'); THEM = loc('them'); REP = loc('replay');
  BAO = G.suKien.filter((e) => ['loi', 'the', 'cot', 'cuu', 'truot', 'dau', 'cang'].includes(e.k));
  THAY = loc('thay'); CANG = loc('cang'); VAR = loc('var'); VKQ = loc('varKq'); VDONG = loc('varDong'); DAU = loc('dau'); TROI = G.troi ?? 'ngay';
  // bàn bị VAR huỷ: biến khỏi cột đội đúng lúc công bố quyết định
  for (const q of VKQ) if (q.loai === 'ban' && q.ket === 'huy') { const b = [...BAN].reverse().find((x) => x.doi === q.doi && x.t < q.t); if (b) b.tHuy = q.t; }
  const F = [['600', 'normal', 'SemiBold'], ['700', 'normal', 'Bold'], ['800', 'normal', 'ExtraBold'], ['900', 'normal', 'Black'], ['900', 'italic', 'BlackItalic']];
  await Promise.all(F.map(async ([w, st, n]) => { const f = new FontFace('Barlow Condensed', `url(font/BarlowCondensed-${n}.ttf)`, { weight: w, style: st }); await f.load(); document.fonts.add(f); }));
  EVF = []; for (const e of G.suKien) { const f = Math.round(e.t * FPS); (EVF[f] ||= []).push(e); }
  // nền tĩnh (khán đài + sân + vạch) vẽ một lần ra canvas đệm
  NEN = document.createElement('canvas'); NEN.width = VW; NEN.height = VH; veNen(NEN.getContext('2d'));
};

function veNen(c) {
  const cx = L.cx, cy = L.cy, R = L.R;
  const dem = TROI === 'dem', r = c.createRadialGradient(cx, cy, R, cx, cy, 1100); r.addColorStop(0, dem ? '#0a121b' : '#0f1a24'); r.addColorStop(1, '#020406');
  c.fillStyle = r; c.fillRect(0, 0, VW, VH);
  // khán đài: các chấm màu áo hai đội xếp vòng quanh sân (nửa trái màu đội 0, nửa phải đội 1)
  for (let i = 0; i < 2600; i++) {
    const a = hash(i * 3 + 1) * Math.PI * 2, d = R + 60 + hash(i * 7 + 2) * 330, x = cx + Math.cos(a) * d * 1.25, y = cy + Math.sin(a) * d;
    if (x < 0 || x > VW || y < 0 || y > VH) continue;
    const ben = Math.cos(a) < 0 ? 0 : 1, m = G.doi.doi[ben].mau[hash(i * 11) > 0.5 ? 0 : 1];
    c.globalAlpha = 0.18 + hash(i * 13) * 0.3; c.fillStyle = hash(i * 17) > 0.75 ? '#e8e2d0' : m;
    c.beginPath(); c.arc(x, y, 3 + hash(i * 19) * 3, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  // đèn pha bốn góc sân (đêm sáng gắt, ngày mờ)
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const x = cx + sx * R * 1.42, y = cy + sy * R * 1.02, a = dem ? 0.55 : 0.18, q = c.createRadialGradient(x, y, 4, x, y, dem ? 260 : 150);
    q.addColorStop(0, `rgba(255,255,240,${a})`); q.addColorStop(1, 'rgba(255,255,240,0)'); c.fillStyle = q; c.fillRect(x - 300, y - 300, 600, 600);
    c.fillStyle = dem ? '#fffbe6' : 'rgba(255,255,240,0.5)'; for (let k = 0; k < 6; k++) { c.beginPath(); c.arc(x - 25 + (k % 3) * 25, y - 8 + Math.floor(k / 3) * 16, 5, 0, 7); c.fill(); }
  }
  // sân cỏ: sọc dọc hai tông theo thời tiết, vạch trắng
  const CO = { ngay: ['#2f8a3e', '#287a35'], dem: ['#2a8540', '#237336'], mua: ['#2a7a3a', '#226b31'], tuyet: ['#3f8a4a', '#377d41'], suong: ['#2f8a3e', '#287a35'] }[TROI] ?? ['#2f8a3e', '#287a35'];
  c.save(); c.beginPath(); c.arc(cx, cy, R, 0, 7); c.clip();
  for (let i = -12; i < 12; i++) { c.fillStyle = i % 2 ? CO[0] : CO[1]; c.fillRect(cx + i * 70, cy - R, 70, 2 * R); }
  if (TROI === 'mua') for (let i = 0; i < 70; i++) { c.fillStyle = `rgba(190,220,255,${0.05 + hash(i * 23) * 0.07})`; c.beginPath(); c.ellipse(cx + (hash(i * 29) - 0.5) * 2 * R, cy + (hash(i * 31) - 0.5) * 2 * R, 30 + hash(i * 37) * 60, 8 + hash(i * 41) * 14, 0, 0, 7); c.fill(); }   // vũng nước bóng loáng
  if (TROI === 'tuyet') for (let i = 0; i < 900; i++) { const a = hash(i * 43) * 7, d = R * (0.55 + 0.45 * Math.sqrt(hash(i * 47))); c.fillStyle = `rgba(245,248,255,${0.25 + hash(i * 53) * 0.5})`; c.beginPath(); c.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 3 + hash(i * 59) * 9, 0, 7); c.fill(); }   // tuyết đọng mép sân
  const v = c.createRadialGradient(cx, cy, 100, cx, cy, R); v.addColorStop(0, 'rgba(255,255,255,0.06)'); v.addColorStop(1, 'rgba(0,0,0,0.25)'); c.fillStyle = v; c.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(cx, cy - R); c.lineTo(cx, cy + R); c.stroke();
  c.beginPath(); c.arc(cx, cy, 95, 0, 7); c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.8)'; c.beginPath(); c.arc(cx, cy, 6, 0, 7); c.fill();
  for (const s of [-1, 1]) {
    c.strokeRect(s < 0 ? cx - R : cx + R - 150, cy - 165, 150, 330);
    c.strokeRect(s < 0 ? cx - R : cx + R - 60, cy - 90, 60, 180);
    c.beginPath(); c.arc(cx + s * (R - 110), cy, 5, 0, 7); c.fill();
  }
  c.restore();
  // lưới khung thành
  const nua = L.mieng / 2 / R, xm = R * Math.cos(nua);
  for (const s of [-1, 1]) {
    const x0 = cx + s * xm, x1 = cx + s * (R + L.sau);
    c.fillStyle = 'rgba(255,255,255,0.08)'; c.fillRect(Math.min(x0, x1), cy - L.mieng / 2, Math.abs(x1 - x0), L.mieng);
    c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 1.5;
    for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x += 12) { c.beginPath(); c.moveTo(x, cy - L.mieng / 2); c.lineTo(x, cy + L.mieng / 2); c.stroke(); }
    for (let y = cy - L.mieng / 2; y <= cy + L.mieng / 2; y += 12) { c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); }
    c.strokeStyle = '#fff'; c.lineWidth = 6; c.beginPath(); c.moveTo(x0, cy - L.mieng / 2); c.lineTo(x1, cy - L.mieng / 2); c.lineTo(x1, cy + L.mieng / 2); c.lineTo(x0, cy + L.mieng / 2); c.stroke();
  }
  // tường sân: dải bảng LED quanh sân, chừa hai miệng khung
  c.save(); c.lineCap = 'butt';
  for (const [a0, a1] of [[nua, Math.PI - nua], [Math.PI + nua, 2 * Math.PI - nua]]) {
    c.strokeStyle = '#0d1620'; c.lineWidth = L.day + 6; c.beginPath(); c.arc(cx, cy, R + L.day / 2, a0, a1); c.stroke();
    const gr = c.createLinearGradient(cx - R, 0, cx + R, 0); gr.addColorStop(0, G.doi.doi[0].mau[1]); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, G.doi.doi[1].mau[1]);
    c.strokeStyle = gr; c.globalAlpha = 0.85; c.lineWidth = 6; c.beginPath(); c.arc(cx, cy, R + 3, a0, a1); c.stroke(); c.globalAlpha = 1;
  }
  c.restore();
  for (const s of [-1, 1]) for (const y of [-1, 1]) { c.fillStyle = '#fff'; c.beginPath(); c.arc(cx + s * xm, cy + y * L.mieng / 2, 7, 0, 7); c.fill(); }
}

function ao(x, y, r, d, tm, so, a) {   // một cầu thủ: áo theo kiểu đội (trơn / sọc), số áo ở giữa
  const D = G.doi.doi[d], mau = tm ? D.tm : D.mau;
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(4, 7, r, r * 0.9, 0, 0, 7); g.fill();
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.clip();
  g.fillStyle = mau[0]; g.fillRect(-r, -r, 2 * r, 2 * r);
  if (D.kieu === 'soc' && !tm) { g.fillStyle = mau[1]; for (let i = -2; i < 3; i += 2) g.fillRect(i * r / 2.5 - r / 5, -r, r / 2.5, 2 * r); }
  const sh = g.createRadialGradient(-r / 3, -r / 3, 2, 0, 0, r); sh.addColorStop(0, 'rgba(255,255,255,0.35)'); sh.addColorStop(1, 'rgba(0,0,0,0.25)'); g.fillStyle = sh; g.fillRect(-r, -r, 2 * r, 2 * r);
  g.restore();
  g.lineWidth = 4; g.strokeStyle = tm ? mau[1] : D.kieu === 'soc' ? '#ffd84a' : mau[1]; g.beginPath(); g.arc(x, y, r - 2, 0, 7); g.stroke();
  g.fillStyle = tm ? '#fff' : D.chu; g.font = `900 ${r * 0.95}px ${FONT}`; g.textAlign = 'center'; g.fillText(so, x, y + 2); g.textAlign = 'left';
}

function bongDa(x, y, r, a, z = 0, mau = '#fafafa') {   // mau: bóng cam khi tuyết rơi (như ngoài đời)   // z = độ cao bóng: bóng to ra, bóng đổ tách xa và mờ đi
  const R2 = r * (1 + z / 45), dx = 3 + z * 0.55, dy = 5 + z * 0.85;
  g.fillStyle = `rgba(0,0,0,${0.4 - Math.min(0.25, z / 120)})`; g.beginPath(); g.ellipse(x + dx, y + dy, r * (1 - z / 120), r * 0.85 * (1 - z / 120), 0, 0, 7); g.fill();
  r = R2;
  g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.arc(0, 0, r, 0, 7); g.clip();
  g.fillStyle = mau; g.fillRect(-r, -r, 2 * r, 2 * r);
  const ngu = (cx, cy, s) => { g.beginPath(); for (let k = 0; k < 5; k++) { const q = -Math.PI / 2 + k * 2 * Math.PI / 5; g[k ? 'lineTo' : 'moveTo'](cx + Math.cos(q) * s, cy + Math.sin(q) * s); } g.closePath(); g.fill(); };
  g.fillStyle = '#151515'; ngu(0, 0, r * 0.38);
  for (let k = 0; k < 5; k++) { const q = -Math.PI / 2 + k * 2 * Math.PI / 5 + Math.PI / 5; ngu(Math.cos(q) * r * 0.95, Math.sin(q) * r * 0.95, r * 0.32); }
  g.restore();
  g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
}

const ra = (p) => !p || p[0] < -900;   // cầu thủ đã rời sân (thẻ đỏ)
const khungTa = (d) => (d === 0 ? L.cx + L.R : L.cx - L.R);   // khung thành đội d tấn công
const veThe = (x, y, mau, s = 1) => { g.save(); g.translate(x, y); g.rotate(-0.12); g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(-9 * s + 3, -13 * s + 3, 18 * s, 26 * s); g.fillStyle = mau === 'vang' ? '#ffd400' : '#e0161b'; g.fillRect(-9 * s, -13 * s, 18 * s, 26 * s); g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.5; g.strokeRect(-9 * s, -13 * s, 18 * s, 26 * s); g.restore(); };
const songCoi = (t) => COI.find((e) => t >= e.t && t - e.t < 0.6);
const dangReplay = (t) => REP.find((e) => t >= e.t && t < e.t + e.dai);

function trongTai(k, t) {
  const p = k.p[BI + 1]; if (!p) return;
  const e = songCoi(t);
  if (e) for (const q of [0, 0.2]) { const u = (t - e.t - q) / 0.4; if (u < 0 || u > 1) continue; g.strokeStyle = `rgba(255,255,255,${0.8 * (1 - u)})`; g.lineWidth = 3; g.beginPath(); g.arc(p[0], p[1], 18 + u * 50, 0, 7); g.stroke(); }
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(p[0] + 3, p[1] + 6, 16, 14, 0, 0, 7); g.fill();
  g.fillStyle = '#121212'; g.beginPath(); g.arc(p[0], p[1], 16, 0, 7); g.fill();
  g.strokeStyle = '#d7ff1f'; g.lineWidth = 4; g.beginPath(); g.arc(p[0], p[1], 14, 0, 7); g.stroke();
  g.fillStyle = '#d7ff1f'; g.font = `900 12px ${FONT}`; g.textAlign = 'center'; g.fillText('REF', p[0], p[1] + 1); g.textAlign = 'left';
}

function sanVat(f, k, t) {
  const rep = k.r ? dangReplay(t) : null;
  // vạch xịt sơn (vanishing spray) trước quả đá phạt: cung 9,15 m chắn tường người
  for (const e of LOI) {
    if (e.kieu !== 'fk' || t < e.t + 0.6) continue;
    const da = COI.find((c) => c.loai === 'da' && c.t > e.t), het = (da?.t ?? e.t + 3) + 2.5; if (t > het || k.r) continue;
    const a0 = Math.atan2(L.cy - e.y, khungTa(1 - e.doi) - e.x), mo = Math.min(1, (t - e.t - 0.6) * 3) * Math.min(1, (het - t) / 1.2);
    g.fillStyle = `rgba(255,255,255,${0.75 * mo})`;
    for (let q = -9; q <= 9; q++) { const a = a0 + q * 0.06; g.beginPath(); g.arc(e.x + Math.cos(a) * 88, e.y + Math.sin(a) * 88, 3.2, 0, 7); g.fill(); }
    g.beginPath(); g.arc(e.x, e.y, 5, 0, 7); g.fill();
  }
  // vệt bóng
  for (let d = 10; d >= 1; d--) { const q = G.khung[f - d]; if (!q) continue; const p = q.p[BI]; g.globalAlpha = 0.04 * (11 - d); g.fillStyle = '#fff'; g.beginPath(); g.arc(p[0], p[1], L.rBong * (1 - d / 14), 0, 7); g.fill(); }
  g.globalAlpha = 1;
  // phát lại: vòng sáng dưới chân người ghi bàn
  if (rep && rep.i >= 0 && !ra(k.p[rep.i])) { const p = k.p[rep.i], u = (t * 2) % 1; g.strokeStyle = '#ffd84a'; g.lineWidth = 5; g.beginPath(); g.arc(p[0], p[1], L.r + 8, 0, 7); g.stroke(); g.strokeStyle = `rgba(255,216,74,${1 - u})`; g.lineWidth = 3; g.beginPath(); g.arc(p[0], p[1], L.r + 8 + u * 26, 0, 7); g.stroke(); }
  if (k.r === 'f') varKhung(k, t);
  // cáng: hai nhân viên y tế khiêng người chấn thương về đường hầm
  for (const e of CANG) { if (t < e.t || t > e.t + e.dai) continue; const p = k.p[e.i]; if (ra(p)) continue; g.fillStyle = '#f2f2f2'; g.strokeStyle = '#c62828'; g.lineWidth = 3; g.beginPath(); g.roundRect(p[0] - 14, p[1] - 30, 28, 60, 6); g.fill(); g.stroke(); for (const s of [-1, 1]) yTe(p[0], p[1] + s * 42); }
  // y tế chạy vào chữa: hai chấm trắng chữ thập đỏ quanh người nằm sân
  for (const e of DAU) { if (t < e.t || t > e.t + e.dai) continue; const p = k.p[e.i]; if (ra(p)) continue; const u = Math.min(1, (t - e.t) / 0.6); yTe(p[0] - 34 * u + (1 - u) * 0, p[1] + L.R * (1 - u) * 0.3 + 6); yTe(p[0] + 34 * u, p[1] + L.R * (1 - u) * 0.3 - 6); }
  trongTai(k, t);
  G.ct.forEach((c, i) => { const p = k.p[i]; if (!ra(p)) ao(p[0], p[1], L.r, c.doi, c.tm, nguoi(i, t).so, p[2]); });
  // người sắp vào sân đứng chờ cạnh trọng tài thứ tư tới lúc người ra tới nơi
  for (const e of THAY) { if (t < e.t || t >= doiLuc(e) || e.ly === 'dau') continue; const x = L.cx + (e.doi ? 40 : -40), y = L.cy + L.R + 34; ao(x, y, L.r * 0.9, e.doi, false, e.vaoSo, 0); }
  const b = k.p[BI]; bongDa(b[0], b[1], L.rBong, b[2], k.z ?? 0, TROI === 'tuyet' ? '#ff8a1c' : '#fafafa');
  // thẻ giơ lên trên đầu người bị phạt
  for (const e of THE) {
    const u = t - e.t; if (u < 0 || u > 1.8) continue;
    const p = ra(k.p[e.i]) ? k.p[BI + 1] : k.p[e.i], y = p[1] - L.r - 34 - ease(u * 3) * 10;
    if (e.mau === 'vang2') { veThe(p[0] - 8, y, 'vang', 1.3); veThe(p[0] + 8, y + 4, 'do', 1.3); } else veThe(p[0], y, e.mau, 1.4);
  }
  // nhãn tên người đang giữ bóng (người chạm bóng cuối)
  const c = G.ct[k.c]; if (c && k.c >= 0 && !ra(k.p[k.c]) && k.r !== 'f') {
    const ten = nguoi(k.c, t).ten, p = k.p[k.c], D = G.doi.doi[c.doi], w = Math.max(70, ten.length * 13 + 26), y = p[1] - L.r - 24;
    g.fillStyle = 'rgba(8,12,18,0.82)'; g.beginPath(); g.roundRect(p[0] - w / 2, y - 15, w, 30, 8); g.fill();

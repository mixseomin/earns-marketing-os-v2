<!doctype html>
<!-- SHOT CODE mẫu Scam or Real (anh 01/11/2026): lớp HÌNH dựng bằng HTML thay cho ASS (may-dung-scam.ts › assScam). Tiếng + khung + ảnh tĩnh
     vẫn do box3 lo (may.ts › xuatVideo, cột hinh_code). Mốc giây = nhipScam (luật đọc: mỗi khối chữ đứng đủ thời gian đọc) — trang không tự đặt giây.
     Hợp đồng quay (dung.mjs): window.CAU = cauScam(de) + nen → await __dung() → __seek(t) vẽ đúng khung giây t, thuần theo t (không timer, không CSS animation).
     Đổi hình ở đây = tăng PHIEN_CODE_SCAM (may-dung-scam.ts) để máy dựng lại mọi video. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: M; src: url(../../public/fonts/Montserrat-ExtraBold.ttf); font-weight: 800; }
@font-face { font-family: M; src: url(../../public/fonts/Montserrat-Black.ttf); font-weight: 900; }
@font-face { font-family: A; src: url(../../public/fonts/AtkinsonHyperlegible-Bold.ttf); font-weight: 700; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#san { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: A, sans-serif; color: #111; --kenh: #1FA855; --ket: #E5484D; }
#nen { position: absolute; inset: -40px; background-size: cover; background-position: center; }
#toi { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,16,32,.55) 0%, rgba(10,16,32,.15) 35%, rgba(10,16,32,.25) 70%, rgba(10,16,32,.7) 100%); }
#loe { position: absolute; inset: 0; box-shadow: inset 0 0 260px 40px var(--ket); opacity: 0; }
#dau { position: absolute; top: 70px; left: 0; right: 0; text-align: center; }
#dau h1 { font: 900 108px/1 M; letter-spacing: -2px; text-shadow: 0 6px 0 rgba(0,0,0,.35); }
#dau h1 .s { color: #E5484D; } #dau h1 .o { color: #fff; font-size: 70px; } #dau h1 .r { color: #2EBD85; }
#dau p { font: 800 40px M; color: #fff; margin-top: 14px; text-shadow: 0 3px 8px rgba(0,0,0,.6); }
#the { position: absolute; top: 290px; left: 60px; width: 960px; border-radius: 34px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); background: #EFE7DD; }
#the.Email { background: #fff; } #the.SMS { background: #F2F3F5; }
.dau-the { background: var(--kenh); color: #fff; padding: 26px 34px; display: flex; gap: 22px; align-items: center; }
.av { flex: 0 0 76px; height: 76px; border-radius: 50%; background: #fff; color: var(--kenh); font: 900 40px/76px M; text-align: center; }
.kenh { font: 700 26px A; opacity: .85; } .gui { font: 800 36px/1.15 M; }
#chude { display: none; padding: 26px 40px 0 78px; font: 800 40px/1.25 M; color: #111; }
#the.Email #chude { display: block; }
#chat { padding: 30px 30px 34px 78px; display: flex; flex-direction: column; gap: 18px; position: relative; }
.bong { align-self: flex-start; max-width: 820px; background: #fff; border-radius: 6px 26px 26px 26px; padding: 22px 28px 16px; font: 700 40px/1.3 A; position: relative; box-shadow: 0 2px 2px rgba(0,0,0,.08); }
#the.SMS .bong { background: #E3E5E9; border-radius: 26px 26px 26px 6px; box-shadow: none; }
#the.Email .bong { background: none; box-shadow: none; padding: 6px 4px; max-width: 860px; border-radius: 10px; }
.bong .gio { display: block; text-align: right; font: 700 22px A; color: #8a8f98; margin-top: 4px; }
#the.Email .bong .gio { display: none; }
.bong.link .chu { color: #1a5fd0; text-decoration: underline; }
.go { align-self: flex-start; background: #fff; border-radius: 26px; padding: 24px 30px; display: flex; gap: 12px; position: absolute; left: 78px; }
#the.SMS .go { background: #E3E5E9; }
.go i { width: 18px; height: 18px; border-radius: 50%; background: #9aa0a6; display: block; }
.so { position: absolute; left: -66px; top: 50%; width: 52px; height: 52px; margin-top: -26px; border-radius: 50%; background: #E5484D; color: #fff; font: 900 32px/52px M; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,.3); }
#vien { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
#dong-dau { position: absolute; top: 1730px; left: 50%; margin-left: -230px; width: 460px; text-align: center; font: 900 130px/1 M; color: #fff; background: var(--ket); padding: 14px 40px 22px; border-radius: 22px; border: 8px solid #fff; transform-origin: center; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
#ly { position: absolute; left: 60px; right: 60px; display: grid; gap: 18px; }
#ly div { background: rgba(20,33,61,.92); color: #fff; border-left: 12px solid var(--ket); border-radius: 16px; padding: 22px 30px; font: 800 42px/1.2 M; display: flex; gap: 22px; align-items: center; }
#ly b { flex: 0 0 56px; height: 56px; border-radius: 50%; background: var(--ket); font: 900 32px/56px M; text-align: center; }
#dem { position: absolute; left: 50%; top: 1560px; width: 240px; height: 240px; margin-left: -120px; }
#dem svg { position: absolute; inset: 0; }
#dem span { position: absolute; inset: 0; text-align: center; font: 900 120px/240px M; color: #fff; text-shadow: 0 4px 12px rgba(0,0,0,.5); }
#ket { position: absolute; inset: 0; background: rgba(14,22,44,.82); color: #fff; padding: 0 80px; display: flex; flex-direction: column; justify-content: center; gap: 46px; opacity: 0; }
#ket .k1 { font: 900 86px/1.12 M; }
#ket .k2 { font: 700 46px/1.35 A; color: #d6dbe6; display: flex; gap: 22px; }
#ket .k2 b { color: #2EBD85; }
#ket .k3 { font: 800 44px M; color: #d6dbe6; }
#ket .nut { align-self: flex-start; background: #FCA311; color: #14213D; font: 900 76px M; padding: 22px 46px; border-radius: 22px; box-shadow: 0 14px 40px rgba(252,163,17,.35); white-space: nowrap; }
#ket .k4 { font: 800 38px M; color: #FCA311; }
</style></head>
<body><div id="san">
  <div id="nen"></div><div id="toi"></div><div id="loe"></div>
  <div id="dau"><h1><span class="s">SCAM</span> <span class="o">or</span> <span class="r">REAL?</span></h1><p>Spot the red flags in 7 seconds</p></div>
  <div id="the"><div class="dau-the"><div class="av" id="av"></div><div><div class="kenh" id="kenh"></div><div class="gui" id="gui"></div></div></div><div id="chude"></div><div id="chat"></div></div>
  <svg id="vien" width="1080" height="1920"></svg>
  <div id="dong-dau"></div>
  <div id="ly"></div>
  <div id="dem"><svg width="240" height="240"><circle cx="120" cy="120" r="104" fill="rgba(20,33,61,.75)" stroke="rgba(255,255,255,.18)" stroke-width="16"/><circle id="vong" cx="120" cy="120" r="104" fill="none" stroke="#FCA311" stroke-width="16" stroke-linecap="round" transform="rotate(-90 120 120)"/></svg><span id="giay"></span></div>
  <div id="ket"><div class="k1" id="k1"></div><div class="k2" id="k2"></div><div class="k3" id="k3"></div><div class="nut" id="nut"></div><div class="k4" id="k4"></div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const kep = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const tien = (t, a, d) => kep((t - a) / d);                        // 0→1 trong [a, a+d]
const ra = (x) => 1 - Math.pow(1 - x, 3);                          // ease-out
const nay = (x) => { const c = 1.70158 * 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };  // vượt rồi về
const MAU_KENH = { WhatsApp: '#1FA855', Email: '#3B6FE0', SMS: '#5B6472' };
let C, BONG = [], MOC = [], LUA = true, CO = [];
window.__dung = () => {
  C = window.CAU; const d = C.de; LUA = d.ket === 'scam';
  const san = $('san'); san.style.setProperty('--kenh', MAU_KENH[d.kenh] || '#1FA855'); san.style.setProperty('--ket', LUA ? '#E5484D' : '#2EBD85');
  $('nen').style.backgroundImage = `url(${C.nen})`;
  $('the').className = d.kenh; $('av').textContent = d.gui[0]; $('kenh').textContent = d.kenh; $('gui').textContent = d.gui;
  $('chude').textContent = d.tieu_de || '';
  $('dong-dau').textContent = LUA ? 'SCAM' : 'REAL';
  d.dong.forEach((x, i) => {
    const b = document.createElement('div'); b.className = 'bong' + (/^(https?:\/\/)?[\w-]+(\.[\w-]+)*\.[a-z]{2,}(\/\S*)?$/i.test(x.t.trim()) ? ' link' : '');
    b.innerHTML = `<span class="chu"></span><span class="gio">10:4${2 + i}</span>`; b.querySelector('.chu').textContent = x.t;
    if (x.co && LUA) { const s = document.createElement('div'); s.className = 'so'; s.textContent = x.co; b.appendChild(s); }
    $('chat').appendChild(b); BONG.push(b);
  });
  CO = d.dong.map((x) => (LUA && x.co) || 0);
  const go = document.createElement('div'); go.className = 'go'; go.id = 'go'; go.innerHTML = '<i></i><i></i><i></i>'; $('chat').appendChild(go);
  // từng đoạn hiện trong 4,6 giây đầu của 7 giây đếm (còn ≥ 2 giây soi cả tin); chat có chấm "đang gõ" 0,35s trước mỗi bong bóng, email thì không
  MOC = d.dong.map((_, i) => C.T_DEM + 0.2 + i * 4.6 / d.dong.length);
  d.ly_do.slice(0, 3).forEach((s, i) => { const e = document.createElement('div'); e.innerHTML = `<b>${LUA ? i + 1 : '✓'}</b><span></span>`; e.querySelector('span').textContent = s; $('ly').appendChild(e); });
  $('k1').textContent = C.ket[0]; $('k2').innerHTML = '<b>✓</b><span></span>'; $('k2').querySelector('span').textContent = C.ket[1];
  const m = C.ket[2].match(/^(.*?):\s*(\S+)$/) || [null, C.ket[2], ''];
  $('k3').textContent = m[1] + ':'; $('nut').dataset.chu = m[2]; $('k4').textContent = C.phu || '';
  return document.fonts.ready.then(() => { $('ly').style.top = ($('the').offsetTop + $('the').offsetHeight + 40) + 'px'; });
};
window.__seek = (t) => {
  const d = C.de, lo = t >= C.T_LO, email = d.kenh === 'Email';
  // nền đẩy chậm suốt video — không khung nào đứng hình hẳn
  $('nen').style.transform = `scale(${1 + 0.1 * t / C.DAI}) translateY(${-14 * t / C.DAI}px)`;
  const a = ra(tien(t, 0, 0.35)); $('dau').style.transform = `translateY(${(1 - a) * -120}px)`; $('dau').style.opacity = a;
  const b = ra(tien(t, 0.05, 0.4)); $('the').style.transform = `translateY(${(1 - b) * 160}px) scale(${0.94 + 0.06 * b})`; $('the').style.opacity = b;
  $('chude').style.opacity = ra(tien(t, C.T_DEM, 0.3));
  let goDang = null;
  BONG.forEach((e, i) => {
    const vao = email ? MOC[i] : MOC[i] + 0.35, hien = tien(t, vao, 0.3);
    e.style.opacity = lo && !CO[i] ? 0.55 : hien;
    e.style.transformOrigin = 'left top';
    e.style.transform = email ? `translateY(${(1 - ra(hien)) * 24}px)` : `translateY(${(1 - ra(hien)) * 30}px) scale(${hien ? 0.85 + 0.15 * nay(hien) : 0.85})`;
    if (!email && t >= MOC[i] && t < MOC[i] + 0.35) goDang = e;
    const so = e.querySelector('.so'); if (so) so.style.transform = `scale(${nay(tien(t, C.T_LO + 0.35 + (CO[i] - 1) * 0.4, 0.3))})`;
  });
  const go = $('go');
  if (goDang) { go.style.display = 'flex'; go.style.top = goDang.offsetTop + 'px'; go.querySelectorAll('i').forEach((x, k) => x.style.transform = `translateY(${Math.sin(t * 14 - k * 0.9) * -7}px)`); }
  else go.style.display = 'none';
  // vòng đếm: khớp tiếng tích của box (amScam: tích đúng lúc đổi số), đỏ 2 giây cuối, đập nhẹ ngay khi đổi số
  const con = Math.max(0, C.T_LO - t), CHU_VI = 2 * Math.PI * 104, le = ((t - C.T_DEM) % 1 + 1) % 1;
  $('vong').setAttribute('stroke-dasharray', CHU_VI); $('vong').setAttribute('stroke-dashoffset', CHU_VI * (1 - con / (C.T_LO - C.T_DEM)));
  $('vong').setAttribute('stroke', con <= 2 ? '#E5484D' : '#FCA311');
  $('giay').textContent = Math.ceil(con);
  const dap = t >= C.T_DEM ? 1 + 0.07 * Math.pow(1 - le, 8) * (con <= 3 ? 2 : 1) : 1;
  $('dem').style.transform = `scale(${lo ? 1 - ra(tien(t, C.T_LO, 0.25)) : dap * ra(tien(t, C.T_DEM, 0.3))})`; $('dem').style.opacity = lo ? 1 - tien(t, C.T_LO, 0.25) : 1;
  // lộ: dấu đập vào, rung màn, viền loé; khoanh từng dòng có dấu hiệu tự vẽ ra (chỉ ca SCAM)
  const s = tien(t, C.T_LO, 0.28), rung = lo && t < C.T_LO + 0.6 ? Math.sin((t - C.T_LO) * 70) * (LUA ? 14 : 6) * (1 - tien(t, C.T_LO + 0.2, 0.4)) : 0;
  $('dong-dau').style.opacity = lo ? 1 : 0; $('dong-dau').style.transform = `rotate(-8deg) scale(${2.6 - 1.6 * ra(s)})`;
  $('san').style.transform = `translate(${rung}px, ${rung * 0.6}px)`;
  $('loe').style.opacity = lo ? 0.9 * (1 - tien(t, C.T_LO + 0.1, 0.9)) + 0.25 * tien(t, C.T_LO + 1, 1) : 0;
  // GIỮ ĐỂ ĐỌC (T_LO → T_KET): lần lượt soi từng dấu hiệu — dòng khoanh + lý do cùng số sáng lên theo vòng, mắt có chỗ đi mà chữ vẫn đứng yên để đọc
  const nLy = Math.min(3, d.ly_do.length), batDau = C.T_LO + 0.5 + nLy * 0.4 + 0.4, chu = 1.3;
  const dangSoi = lo && t >= batDau ? Math.floor((t - batDau) / chu) % nLy : -1, sang = dangSoi >= 0 ? Math.sin(Math.PI * (((t - batDau) / chu) % 1)) : 0;
  const v = $('vien'); v.innerHTML = '';
  if (lo) BONG.forEach((e, i) => {
    if (!CO[i]) return;
    const p = ra(tien(t, C.T_LO + 0.35 + (CO[i] - 1) * 0.4, 0.45)), r = e.getBoundingClientRect(), rs = $('san').getBoundingClientRect();
    const x = r.left - rs.left - 12, y = r.top - rs.top - 10, w = r.width + 24, h = r.height + 20, cv = 2 * (w + h), hl = CO[i] - 1 === dangSoi ? sang : 0;
    v.insertAdjacentHTML('beforeend', `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="rgba(229,72,77,${0.12 * p + 0.16 * hl})" stroke="#E5484D" stroke-width="${9 + 5 * hl}" stroke-dasharray="${cv}" stroke-dashoffset="${cv * (1 - p)}"/>`);
  });
  [...$('ly').children].forEach((e, i) => {
    const p = ra(tien(t, C.T_LO + 0.5 + i * 0.4, 0.35)), hl = i === dangSoi ? sang : 0;
    e.style.opacity = p; e.style.transform = `translateX(${(1 - p) * -120}px) scale(${1 + 0.035 * hl})`;
    e.style.background = `rgba(${20 + 30 * hl}, ${33 + 10 * hl}, ${61 + 10 * hl}, .92)`;
  });
  // màn kết thay hẳn cảnh trước: từng câu hiện, tên trang gõ ra rồi nút nhịp; giữ để đọc thì dấu ✓ và nút thay nhau sáng
  const k = tien(t, C.T_KET, 0.4); $('ket').style.opacity = k;
  if (k > 0) ['the', 'ly', 'dong-dau', 'dau', 'vien', 'loe'].forEach((id) => { $(id).style.opacity = String(Number($(id).style.opacity || 1) * (1 - k)); });
  [['k1', 0.1], ['k2', 0.9], ['k3', 1.8], ['nut', 2.2], ['k4', 3.6]].forEach(([id, tre]) => { const p = ra(tien(t, C.T_KET + tre, 0.4)); $(id).style.opacity = p; $(id).style.transform = `translateY(${(1 - p) * 40}px)`; });
  const nut = $('nut'), chuNut = nut.dataset.chu || '', go2 = tien(t, C.T_KET + 2.4, 1.0);
  nut.textContent = chuNut.slice(0, Math.round(chuNut.length * go2)) + (go2 < 1 && Math.floor(t * 4) % 2 ? '|' : '');
  if (go2 >= 1) { const nh = (Math.sin((t - C.T_KET - 3.4) * 4) + 1) / 2; nut.style.transform += ` scale(${1 + 0.05 * nh})`; nut.style.boxShadow = `0 14px ${40 + 30 * nh}px rgba(252,163,17,${0.3 + 0.35 * nh})`; }
  $('k2').querySelector('b').style.transform = `scale(${1 + 0.25 * Math.max(0, Math.sin((t - C.T_KET - 1.3) * 2.2))})`;
};
</script></body></html>

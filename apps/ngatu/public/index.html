<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ngã Tư</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23333'/><rect x='13' y='2' width='6' height='28' fill='%23777'/><rect x='2' y='13' width='28' height='6' fill='%23777'/><circle cx='16' cy='16' r='4' fill='%23f2c230'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ngatu.css?v=__BAN__">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="nap">Đang cho xe chạy trước…</div>
<header class="bang tren">
  <h1>Ngã Tư <small>giờ tan tầm</small></h1>
  <div id="den"></div>
</header>
<aside class="bang ben">
  <div class="nut cam">
    <button data-cam="tong" class="on">Toàn cảnh</button>
    <button data-cam="tren">Từ trên</button>
    <button data-cam="goc">Ban công</button>
<!--    <button data-cam="theo">Theo xe</button>  tạm bỏ 21/11/2026 -->
    <button id="mo" title="Số liệu và điều khiển">⚙</button>
  </div>
  <div class="nut cong">
    <span>Bấm vào xe / người:</span>
    <button data-cong="nhac" class="on">Túm ra chỗ khác</button>
    <button data-cong="nga">Đẩy ngã</button>
  </div>
  <div id="than">
    <div id="so"></div>
    <label>Mật độ xe máy <b id="vMd">250</b><input id="md" type="range" min="50" max="1000" step="10" value="250"></label>
    <label>Liều (vượt đèn) <b id="vLieu">12%</b><input id="lieu" type="range" min="0" max="60" value="12"></label>
    <label>Ô tô so với xe máy <b id="vOto">7%</b><input id="oto" type="range" min="0" max="40" value="7"></label>
    <label class="chk"><input id="rp" type="checkbox" checked> Xe máy rẽ phải khi đèn đỏ</label>
    <label class="chk"><input id="cn" type="checkbox"> Lòng ngã tư kẹt thì chờ ở vạch (luật nước ngoài)</label>
    <label>Kiểu đèn
      <select id="kp">
        <option value="2pha">2 pha (Đông–Tây / Bắc–Nam)</option>
        <option value="trai">Có pha rẽ trái riêng (4 pha)</option>
        <option value="huong">Từng hướng một (4 pha)</option>
      </select>
    </label>
    <label>Chờ thoát ngã tư (đỏ cả 4 hướng) <b id="vCt">3 s</b><input id="ct" type="range" min="0" max="8" step="1" value="3"></label>
    <label class="chk"><input id="ai" type="checkbox"> Đèn AI (xanh theo lượng xe chờ)</label>
    <label class="chk"><input id="px" type="checkbox"> Mũi tên rẽ phải luôn xanh</label>
    <div class="nut">
      <button id="dung">Tạm dừng</button>
      <button id="toc">Tốc độ 1×</button>
      <button id="macdinh" title="Đưa mọi tuỳ chọn về như lúc đầu">Mặc định</button>
    </div>
    <p class="goiy">Kéo để xoay, lăn (hoặc chụm hai ngón) để phóng. Bấm vào xe hoặc người để làm việc đang chọn ở hàng "Bấm vào".</p>
  </div>
</aside>
<script type="module" src="ngatu.js?v=__BAN__"></script>
</body>
</html>

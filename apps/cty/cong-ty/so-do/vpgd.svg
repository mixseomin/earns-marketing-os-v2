<text x="335" y="110" text-anchor="middle" font-weight="600">Hùng · Tiếp nhận</text><text x="335" y="128" text-anchor="middle" font-size="10.5">mô hình rẻ · chạy mỗi 15'</text><text x="335" y="150" text-anchor="middle" font-size="10.5">đọc, gắn nhãn, chia mức</text><text x="335" y="166" text-anchor="middle" font-size="10.5">không giải quyết</text><text x="335" y="190" text-anchor="middle" font-size="10.5">loại việc chưa ai chuyên</text><text x="335" y="204" text-anchor="middle" font-size="10.5">→ phiếu "cần tuyển"</text><text x="335" y="228" text-anchor="middle" font-size="10.5">gom mức 3 thành 1 lô/ngày</text>
<text x="545" y="88" text-anchor="middle" font-weight="600" fill="#b4541a">Gấp</text><text x="545" y="104" text-anchor="middle" font-size="10.5">site sập, TK khoá, tiền chảy sai → ca ngoài giờ ngay</text>
<text x="545" y="148" text-anchor="middle" font-weight="600">Cần bàn</text><text x="545" y="164" text-anchor="middle" font-size="10.5">hướng đi, ưu tiên, dự án đứng im → chương trình họp</text>
<text x="545" y="208" text-anchor="middle" font-weight="600">Việc thường</text><text x="545" y="224" text-anchor="middle" font-size="10.5">→ trưởng dự án, mức 1–2</text>
<text x="335" y="302" text-anchor="middle" font-weight="600">Hà · Kiểm soát</text><text x="335" y="318" text-anchor="middle" font-size="10.5">07:30 soát mọi Review: mã bước, link, số</text><text x="335" y="332" text-anchor="middle" font-size="10.5">thiếu → trả về · đạt → lô chờ ký</text>

# DEPLOY KHÔNG ĐƯỢC RA 502 (anh 17/11/2026 "502 rồi"): mỗi lượt GHA khởi động lại app Next (mos2-web / mos2-cty / mos2-studio) ~1-3 giây; ai đang mở
# trang lúc đó ăn trang 502 trần của nginx. Include ở MỨC SERVER của mọi vhost app (đường tuyệt đối /opt/earns-marketing-os-v2/deploy/…, máy chủ git pull là có):
# app chưa nghe cổng → trang "đang cập nhật" tự tải lại sau 2 giây. Location nào tự khai error_page riêng thì không kế thừa khối này.
error_page 502 503 504 = @dang_cap_nhat;
location @dang_cap_nhat {
  default_type text/html; add_header Cache-Control "no-store" always; add_header Retry-After 2 always;
  return 503 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="2"><title>$host · đang cập nhật</title><body style="background:#0f1115;color:#e6e6e6;font:15px system-ui;display:grid;place-items:center;height:100vh;margin:0"><div>$host đang lên bản mới — trang tự tải lại sau 2 giây…</div><script>setTimeout(function(){location.reload()},2000)</script>';
}

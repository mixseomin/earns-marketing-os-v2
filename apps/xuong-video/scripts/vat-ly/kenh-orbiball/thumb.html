<!doctype html><html><head><meta charset="utf-8">
<!-- Khuôn ảnh bìa video trận bóng Orbiball (dung-tran.mjs thay {{…}}): nền ảnh thật Pexels + khung chụp từ chính video + câu hỏi hai đội. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:Anton,Impact,sans-serif;background:#000}
.nen{position:absolute;inset:0;background:url({{NEN}}) center 40%/cover;filter:saturate(1.15)}
.mo{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,20,.92) 0%,rgba(10,10,20,.75) 42%,rgba(10,10,20,.15) 70%,rgba(0,0,0,0) 100%)}
.chu{position:absolute;left:48px;top:120px;width:560px;color:#fff;line-height:.95}
.d1{font-size:{{CO1}}px;color:{{MAU1}};text-shadow:0 6px 0 #000}
.vs{font-size:64px;color:#ffd400;margin:6px 0 2px}
.d2{font-size:{{CO2}}px;text-shadow:0 6px 0 #000}
.hoi{position:absolute;left:52px;top:330px;background:#ffd400;color:#111;font-size:150px;line-height:1;padding:4px 34px;border-radius:18px;transform:rotate(-6deg);box-shadow:0 10px 0 #000}
.khung{position:absolute;right:26px;top:96px;width:660px;border:10px solid #fff;box-shadow:0 18px 40px rgba(0,0,0,.7);transform:rotate(2deg)}
.khung img{display:block;width:100%}
</style></head><body>
<div class="nen"></div><div class="mo"></div>
<div class="chu"><div class="d1">{{D1}}</div><div class="vs">{{VS}}</div><div class="d2">{{D2}}</div><div class="hoi">?</div></div>
<div class="khung"><img src="{{KHUNG}}"></div>
</body></html>

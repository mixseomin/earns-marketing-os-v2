<text x="785" y="90" text-anchor="middle" font-weight="600" fill="#0f6e73">Minh · Chánh văn phòng</text><text x="785" y="108" text-anchor="middle" font-size="10.5">08:00 gom báo cáo các phòng</text><text x="785" y="124" text-anchor="middle" font-size="10.5">mỗi phòng 3 dòng: xong / đang / cần anh</text><text x="785" y="140" text-anchor="middle" font-size="10.5">lấy lô của Hùng, chọn ≤ 3 quyết định</text><text x="785" y="156" text-anchor="middle" font-size="10.5">phòng im &gt; 48h → ghi vào tin</text><text x="785" y="172" text-anchor="middle" font-size="10.5">có mục "cần bàn" → mở họp</text><text x="785" y="188" text-anchor="middle" font-size="10.5">thứ hai: bản tuần</text>
<text x="785" y="272" text-anchor="middle" font-weight="600" fill="#b4541a">Anh · Telegram</text><text x="785" y="288" text-anchor="middle" font-size="10.5">một tin sáng · trả lời "ký C05", "gác J01"</text><text x="785" y="302" text-anchor="middle" font-size="10.5">webhook → issue gắn tên người nhận</text>

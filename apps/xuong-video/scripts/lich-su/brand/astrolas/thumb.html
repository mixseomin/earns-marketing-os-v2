<!doctype html>
<!-- BÌA CHUẨN KÊNH ASTROLAS (anh 07/11/2026: "Thumb phải chuẩn hoá để dùng" — YouTube tự lấy khung outro tối làm bìa). MỘT khuôn cho mọi mẫu, thumb-kenh.mjs đổ dữ liệu qua window.__ve:
     nền ảnh của playlist · chủ thể lớn (ảnh người / tranh / nhân vật / lá số) · chữ to 1–3 từ tự co cho vừa · chữ phụ · logo + nhãn playlist. Cỡ 1080×1920, chữ đọc được khi bìa nhỏ. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: PF; src: url(fonts/PlayfairDisplay.ttf); font-weight: 400 900; }
@font-face { font-family: IN; src: url(fonts/Inter.ttf); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #071426; }
.abs { position: absolute; }
#nen { inset: 0; width: 100%; height: 100%; object-fit: cover; }
#phu0 { inset: 0; background: linear-gradient(180deg, rgba(7,20,38,.25) 0%, rgba(7,20,38,.05) 35%, rgba(7,20,38,.70) 62%, rgba(7,20,38,.96) 100%); }
#anh { left: 0; top: 0; width: 1080px; height: 1300px; object-fit: cover; object-position: 50% 18%; -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%); }
#anh.vua { left: 90px; top: 250px; width: 900px; height: 900px; object-fit: contain; object-position: 50% 50%; -webkit-mask-image: none; filter: drop-shadow(0 18px 40px rgba(0,0,0,.65)); }
#ky { left: 0; right: 0; top: 480px; text-align: center; font: 400 330px/1 IN; color: #F4D971; text-shadow: 0 8px 30px rgba(0,0,0,.7); }
#logo { left: 48px; top: 56px; height: 76px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.8)); }
#chip { left: 48px; top: 150px; font: 800 32px IN; letter-spacing: .12em; text-transform: uppercase; color: #071426; padding: .36em .7em .32em; border-radius: .3em; }
#lon { left: 50px; right: 50px; top: 1240px; height: 400px; display: flex; align-items: flex-end; justify-content: center; text-align: center; font-family: PF; font-weight: 900; line-height: 1.02; color: #fff; text-shadow: 0 6px 0 #071426, 0 0 40px rgba(0,0,0,.75); }
#nho { left: 50px; right: 50px; top: 1672px; text-align: center; font: 800 50px/1.2 IN; letter-spacing: .08em; text-transform: uppercase; color: #F4D971; text-shadow: 0 3px 10px rgba(0,0,0,.9); }
</style></head><body>
<img id="nen" class="abs"><img id="anh" class="abs"><div id="phu0" class="abs"></div><div id="ky" class="abs"></div><img id="logo" class="abs" src="logo/wordmark.png"><div id="chip" class="abs"></div><div id="lon" class="abs"><span></span></div><div id="nho" class="abs"></div>
<script>
window.__ve = async ({ nen, anh, vua, lon, nho, chip, mau, ky }) => {
  document.getElementById('ky').textContent = ky ?? '';
  const $ = (id) => document.getElementById(id); $('nen').src = nen; const a = $('anh'); if (anh) { a.src = anh; a.className = `abs${vua ? ' vua' : ''}`; } else a.style.display = 'none';
  $('chip').textContent = chip; $('chip').style.background = mau; $('nho').textContent = nho ?? ''; const s = $('lon').firstChild; s.textContent = lon;
  await document.fonts.ready; await Promise.all([...document.images].filter((i) => i.getAttribute('src')).map((i) => i.decode().catch(() => { throw new Error('không tải được ' + i.src); })));
  let c = 230; s.style.fontSize = `${c}px`; while ((s.scrollWidth > 980 || s.offsetHeight > 400) && c > 70) { c -= 6; s.style.fontSize = `${c}px`; }   // tự co: tên dài vẫn gọn khung
  return c;
};
window.__xong = true;
</script></body></html>

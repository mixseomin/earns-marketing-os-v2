<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DU = /*__DU_LIEU__*/null;
const T3 = THREE;
const P = (v) => new T3.Vector3(v[0] / 100, (v[2] ?? 0) / 100, -v[1] / 100);   // cm (x đông, y bắc, z lên) → mét three.js (Y lên)
const mauCua = (h) => new T3.Color(h || '#888888');
const man = document.getElementById('man');
const ve = new T3.WebGLRenderer({ antialias: true });
ve.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));

const canh = new T3.Scene();

const may = new T3.PerspectiveCamera(40, 16 / 9, 0.05, 200);

// Một hình của bộ set: tam = đáy giữa (cm), co = [rộng x, sâu y, cao z]
function hinh(p) {
  const c = p.co || [10, 10, 10], vl = new T3.MeshLambertMaterial({ color: mauCua(p.mau) });

    const duong = new T3.CurvePath(); for (let i = 1; i < pts.length; i++) duong.add(new T3.LineCurve3(pts[i - 1], pts[i]));

}
// Vật của set (nền + đồ đạc); vật tuỳ chọn (dây đường đi) chỉ hiện ở shot khai trong may.them
const tuyChon = {};
for (const v of DU.vat) { const m = hinh(v); canh.add(m); if (v.tuy_chon) { tuyChon[v.ten] = m; m.visible = false; } }
// Khối nhân vật / đạo cụ: nhóm quay quanh trục đứng theo huong (0 = mặt nhìn −y)
// NGƯỜI CÓ KHỚP (khoi.hinh = 'nguoi'): ma-nơ-canh FK dựng bằng mã — hông → thân → cổ → đầu, vai → cánh tay → khuỷu → cẳng tay → bàn tay, hông → đùi → gối → cẳng chân.
// Tỉ lệ theo tuổi (trẻ con đầu to, chân ngắn). Mặt trước = +Z cục bộ (huong 0 = nhìn −y dữ liệu).
function nguoi(k) {
  const H = (k.co?.[2] ?? 170) / 100, tre = (k.tuoi ?? 30) < 14;
  const da = new T3.MeshLambertMaterial({ color: mauCua(k.mau) }), ao = new T3.MeshLambertMaterial({ color: mauCua(k.ao || k.mau) }), toc = new T3.MeshLambertMaterial({ color: mauCua(k.mau_toc || '#222') });
  const dau = H * (tre ? 0.17 : 0.13), chan = H * (tre ? 0.44 : 0.47), than = H - chan - dau - H * 0.03, vai = H * (tre ? 0.2 : 0.23);
  const hop = (w, h, d, vl, y) => { const m = new T3.Mesh(new T3.BoxGeometry(w, h, d), vl); m.position.y = y; return m; };
  const khop = (cha, x, y, z) => { const o = new T3.Object3D(); o.position.set(x, y, z); cha.add(o); return o; };
  const g = new T3.Group(), hong = khop(g, 0, chan, 0), lung = khop(hong, 0, 0, 0);
  lung.add(hop(vai * 0.8, than, H * 0.11, ao, than / 2));
  const co = khop(lung, 0, than, 0); co.add(hop(H * 0.05, H * 0.03, H * 0.05, da, H * 0.015));
  const dauK = khop(co, 0, H * 0.03, 0);
  const s = new T3.Mesh(new T3.SphereGeometry(dau / 2, 16, 12), da); s.position.y = dau / 2; dauK.add(s);
  const t = new T3.Mesh(new T3.SphereGeometry(dau / 2 * 1.04, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), toc); t.position.y = dau / 2; dauK.add(t);
  const mui = hop(dau * 0.16, dau * 0.18, dau * 0.2, da, dau * 0.45); mui.position.z = dau / 2; dauK.add(mui);   // mũi = hướng mặt
  const tay = (ben) => {
    const v = khop(lung, ben * vai / 2, than * 0.94, 0), tren = H * 0.17, duoi = H * 0.16;
    v.add(hop(H * 0.055, tren, H * 0.055, ao, -tren / 2));
    const khuyu = khop(v, 0, -tren, 0); khuyu.add(hop(H * 0.045, duoi, H * 0.045, da, -duoi / 2));
    const ban = khop(khuyu, 0, -duoi, 0); ban.add(hop(H * 0.05, H * 0.06, H * 0.03, da, -H * 0.03));
    return { v, khuyu, ban };
  };
  const chanF = (ben) => {
    const d = khop(hong, ben * vai * 0.22, 0, 0), dui = chan * 0.52, cang = chan * 0.48;
    d.add(hop(H * 0.07, dui, H * 0.075, ao, -dui / 2));
    const goi = khop(d, 0, -dui, 0); goi.add(hop(H * 0.055, cang, H * 0.06, ao, -cang / 2));
    const ban = hop(H * 0.06, H * 0.025, H * 0.12, da, -cang); ban.position.z = H * 0.03; goi.add(ban);
    return { d, goi };
  };
  return { g, H, j: { hong, lung, co, dau: dauK, tt: tay(1), tp: tay(-1), ct: chanF(1), cp: chanF(-1) } };
}
const khoi = {};
for (const [ten, k] of Object.entries(DU.khoi)) {
  if (k.hinh === 'nguoi') { const n = nguoi(k); n.g.visible = false; canh.add(n.g); khoi[ten] = { g: n.g, k, ng: n }; continue; }
  const g = new T3.Group();
  g.add(hinh({ ...k, tam: [0, 0, 0] }));
  for (const p of k.phan || []) g.add(hinh(p));
  g.visible = false; canh.add(g); khoi[ten] = { g, k };
}
// TIA NHÌN: đoạn mảnh từ mắt tới đích đang nhìn — soát hướng nhìn bằng mắt ngay trên khung
let nhinCua = {}, hienTia = true; const tia = {};
function veTia() {
  for (const [ten, kk] of Object.entries(khoi)) {
    if (!kk.ng) continue;
    if (!tia[ten]) { tia[ten] = new T3.Line(new T3.BufferGeometry(), new T3.LineBasicMaterial({ color: 0xffd400 })); canh.add(tia[ten]); }
    const n = nhinCua[ten], l = tia[ten];
    l.visible = !!(hienTia && n && kk.g.visible);
    if (l.visible) { const a = new T3.Vector3(); kk.ng.j.dau.getWorldPosition(a); a.y += kk.ng.H * 0.07; l.geometry.setFromPoints([a, P(n.diem)]); }
  }
}
// DÁNG theo khung: đứng · đi (bước theo quãng đã đi) · chống bậu nhoài người (dien chong_ban) · vươn tay trao / nhận đồ · tay cầm đồ
function dang(n, o) {
  const j = n.j; const z = (x) => x.rotation.set(0, 0, 0);
  for (const x of [j.lung, j.co, j.dau, j.tt.v, j.tt.khuyu, j.tp.v, j.tp.khuyu, j.ct.d, j.ct.goi, j.cp.d, j.cp.goi]) z(x);
  if (o.di > 0) {   // chu kỳ bước: sải ~0,75 chiều cao
    const ph = (o.di / (n.H * 75)) * Math.PI * 2, a = Math.sin(ph) * 0.5;
    j.ct.d.rotation.x = a; j.cp.d.rotation.x = -a; j.ct.goi.rotation.x = Math.max(0, -Math.sin(ph)) * 0.7; j.cp.goi.rotation.x = Math.max(0, Math.sin(ph)) * 0.7;
    j.tt.v.rotation.x = -a * 0.8; j.tp.v.rotation.x = a * 0.8; j.lung.rotation.x = 0.06;
  }
  if (o.chong) { j.lung.rotation.x = 0.26; j.co.rotation.x = -0.18; j.tt.v.rotation.x = -0.55; j.tp.v.rotation.x = -0.55; j.tt.khuyu.rotation.x = -0.35; j.tp.khuyu.rotation.x = -0.35; }   // chống bậu: cúi ~15°, tay vừa chạm bậu (sàn toa + 80 cm)
  if (o.cam) { j.tp.v.rotation.x = Math.min(j.tp.v.rotation.x, -0.25); j.tp.khuyu.rotation.x = -0.9; }
  if (o.vuon > 0) { j.tp.v.rotation.x = -0.25 - 1.05 * o.vuon; j.tp.khuyu.rotation.x = -0.9 * (1 - o.vuon) - 0.15; }
  j.tp.v.rotation.z = 0.08; j.tt.v.rotation.z = -0.08;
}
const cao = (ten) => (DU.khoi[ten]?.co?.[2] ?? 100) + Math.max(0, ...(DU.khoi[ten]?.phan || []).map((p) => (p.tam?.[2] ?? 0) + (p.co?.[2] ?? 0) - (DU.khoi[ten]?.co?.[2] ?? 0)));
const em = (u) => u * u * (3 - 2 * u);
const tron = (a, b, u) => a.map((x, i) => x + ((b ?? a)[i] - x) * u);
const gocTron = (a, b, u) => { const d = ((((b - a) % 360) + 540) % 360) - 180; return a + d * u; };

let batDau = []; let tong = 0;
for (const s of DU.shot) { batDau.push(tong); tong += s.giay; }
document.getElementById('tong').textContent = `${DU.shot.length} shot · ${tong.toFixed(1).replace('.', ',')} s · khối ước lượng, chưa phải hình thật`;

// Trạng thái một vị trí ở phần u của shot (đi: theo đường; đứng: quay ở 45 % cuối như bản Blender)
// NHỊP ĐỘNG TÁC (vi_tri.nhip = [{u, p?, h?, nhin?}] — anh 12/11/2026 "nhận tiền xong phải quay đầu về hướng chạy… cụ thể vào"): mốc trong shot (u 0..1),
// giữa hai mốc nội suy mượt; thiếu p / h thì giữ mốc trước. Không có nhip: đi đều tam → den, quay ở 45 % cuối như bản Blender.
function mocNhip(v) {
  if (!v.nhip?.length) return null;
  const ds = [...v.nhip].sort((a, b) => a.u - b.u);
  if (ds[0].u > 0) ds.unshift({ u: 0 });
  if (ds[ds.length - 1].u < 1) ds.push({ u: 1 });
  let p = v.tam, h = v.huong ?? 0, n = v.nhin_ai ?? null;
  return ds.map((k, i) => { p = k.p ?? (i === ds.length - 1 && v.den && !ds.some((x) => x.p) ? v.den : p); h = k.h ?? h; n = k.nhin ?? n; return { u: k.u, p, h, nhin: n }; });
}
function viTriLuc(v, u) {
  const ds = mocNhip(v);
  if (ds) {
    let i = 0; while (i + 1 < ds.length - 1 && u > ds[i + 1].u) i++;
    const a = ds[i], b = ds[Math.min(i + 1, ds.length - 1)], k = b.u > a.u ? em(Math.min(1, Math.max(0, (u - a.u) / (b.u - a.u)))) : 1;
    return { p: tron(a.p, b.p, k), h: gocTron(a.h, b.h, k), nhin: k < 0.5 ? a.nhin : b.nhin };
  }
  const di = !!v.den;
  const p = di ? tron(v.tam, v.den, em(u)) : v.tam;
  const h0 = v.huong ?? 0, h1 = v.huong_den ?? h0;

  return { p, h: gocTron(h0, h1, kq) };
}
const TRAO = (v) => v.trao || [0.35, 0.7];   // khoảng chuyền tay (u) của món đổi tay
const tayLuc = (v, u) => { const k = v.tay; if (!k?.length) return 0; let i = 0; while (i + 1 < k.length - 1 && u > k[i + 1][0]) i++; const [a, b] = [k[i], k[Math.min(i + 1, k.length - 1)]]; return b[0] > a[0] ? a[1] + (b[1] - a[1]) * em(Math.min(1, Math.max(0, (u - a[0]) / (b[0] - a[0])))) : a[1]; };
function dungShot(i, u) {
  const s = DU.shot[i], m = s.may, vt = m.vi_tri || [];
  for (const k of Object.values(khoi)) k.g.visible = false;
  for (const [ten, msh] of Object.entries(tuyChon)) msh.visible = (m.them || []).includes(ten);
  const cho = {}, kep = (x) => Math.min(1, Math.max(0, x));
  const vuonCua = {};
  // đổi tay trong shot: đồ có 'cam' + 'den' → người đưa = cam, người nhận = người khác gần 'den' nhất
  const trao = vt.filter((v) => v.cam && v.den).map((v) => {
    const nhan = vt.filter((x) => !x.cam && khoi[x.ten]?.ng && x.ten !== v.cam).sort((a, b) => Math.hypot(a.tam[0] - v.den[0], a.tam[1] - v.den[1]) - Math.hypot(b.tam[0] - v.den[0], b.tam[1] - v.den[1]))[0];
    return { mon: v.ten, dua: v.cam, nhan: nhan?.ten, khoang: TRAO(v) };
  });
  const dangCam = new Set(vt.filter((v) => v.cam && !v.den).map((v) => v.cam));
  for (const v of vt) {   // người + tàu trước, đồ cầm sau (đồ bám bàn tay người cầm)
    if (v.cam || !khoi[v.ten]) continue;
    const t = viTriLuc(v, u); cho[v.ten] = t;
    const kk = khoi[v.ten], g = kk.g; g.visible = true; g.position.copy(P(t.p)); g.rotation.set(0, (t.h * Math.PI) / 180, 0);

    if (b.truc) trucCanh = { truc: b.truc, so: s.so };
    if (c.truc && trucCanh && c.truc !== trucCanh.truc && !DU.shot[i + 1].may.qua_truc) loi.push(`máy nhảy sang bên kia trục chú – nhóc so với #${trucCanh.so} (luật 180°)`);
    for (const [ten, x] of Object.entries(b.ng)) { const y = c.ng[ten]; if (x.di && y?.di && x.di !== y.di) loi.push(`${tenVi(ten)} đang đi ${MAN_VI[x.di]} → shot sau đi ${MAN_VI[y.di]} (đổi hướng di chuyển trên màn)`); }
    for (const [mon, ai] of Object.entries(b.cam)) if (c.cam[mon] && c.cam[mon] !== ai) loi.push(`${mon}: cuối shot ${tenVi(ai)} cầm → shot sau ${tenVi(c.cam[mon])} cầm`);
    NOI.push({ tu: s.so, den: DU.shot[i + 1].so, loi });
  });
  const ol = document.getElementById('noi');
  for (const n of NOI) { const li = document.createElement('li'); li.className = n.loi.length ? 'loi' : 'dat'; li.innerHTML = `<b>#${n.tu} → #${n.den}</b><span>${n.loi.length ? '⚠ ' + n.loi.join(' · ') : '✓ khớp'}</span>`; ol.appendChild(li); }
}

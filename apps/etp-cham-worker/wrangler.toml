# Worker CHẤM CREATIVE ETHOPEX (anh 25/10/2026: "chấm điểm sao lại cài trên iMac" → chọn Cloudflare Worker, tài khoản Eimagini Workers Paid).
# Deploy từ box1 (khoá Cloudflare ở /root/.secrets/cf-bwp.ini): apps/etp-cham-worker/trien-khai.sh
name = "etp-cham"
main = "src/index.ts"
compatibility_date = "2025-10-01"

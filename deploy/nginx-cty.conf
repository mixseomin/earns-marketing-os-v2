# cty.on.tc — Công ty AI (apps/cty :3860, mos2-cty.service). Vhost RIÊNG như studio: sập cái này không kéo mos2.on.tc theo.
# Cert wildcard on.tc dùng chung; Cloudflare đứng trước (DNS *.on.tc đã trỏ sẵn). deploy.sh cài file này vào sites-enabled/cty.on.tc.
# Văn phòng pixel của từng phòng phục vụ ở cty.on.tc/vp/<phòng>/ (anh 11/10/2026: KHÔNG tạo subdomain mỗi phòng). Mỗi văn phòng
# là một tiến trình pixel-agents riêng; thêm phòng = thêm MỘT dòng ở map này + một unit mos2-vp-<phòng>.service. Không có trong map → 404.
map $vp_phong $vp_cong {
  default     0;
  cong-ty     3861;   # mos2-vp.service — cả công ty
  thu-nghiem  3863;   # mos2-vp-thu.service — Phòng thử
}
server { listen 80; server_name cty.on.tc; return 301 https://$host$request_uri; }
server {
  listen 443 ssl; http2 on;
  server_name cty.on.tc;
  include snippets/cloudflare-allow.conf;
  ssl_certificate /etc/letsencrypt/live/on.tc/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/on.tc/privkey.pem;
  client_max_body_size 10m;

  # Cổng phiên cho văn phòng: pixel-agents không có đăng nhập, ai vào cũng ghi đè ghế/layout qua WebSocket → hỏi app cty trước.
  location = /_phien {
    internal;
    proxy_pass http://127.0.0.1:3860/api/phien;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }
  location = /vp/vp-chen.js { alias /opt/earns-marketing-os-v2/deploy/vp-chen.js; default_type application/javascript; add_header Cache-Control "no-cache"; }
  # Tệp tĩnh của văn phòng (js/css/phông/ảnh — mã gói pixel-agents, không có dữ liệu) đọc THẲNG từ đĩa: không hỏi phiên từng tệp,
  # nén gzip (phông 1,08MB + js 354KB trước đi trần), bộ đệm dài để Cloudflare + trình duyệt giữ. Đo 11/10/2026: mở văn phòng chậm.
  location ~ ^/vp/(?<vp_phong>[a-z0-9-]+)/(?<vp_tinh>(?:assets|fonts)/[^/]+|[a-z]+\.png)$ {
    if ($vp_cong = 0) { return 404; }
    alias /usr/lib/node_modules/pixel-agents/dist/webview/$vp_tinh;
    types { application/javascript js; text/css css; font/ttf ttf; image/png png; }
    gzip on; gzip_types application/javascript text/css font/ttf; gzip_min_length 1024;
    sub_filter 'window.location.host}/ws' 'window.location.host}/vp/$vp_phong/ws';
    sub_filter_once off;
    sub_filter_types application/javascript;
    add_header Cache-Control "public, max-age=604800";
  }
  location ~ ^/vp/(?<vp_phong>[a-z0-9-]+)/(?<vp_duong>.*)$ {
    if ($vp_cong = 0) { return 404; }
    auth_request /_phien;
    proxy_pass http://127.0.0.1:$vp_cong/$vp_duong$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding "";
    # Tài nguyên dùng đường tương đối (./assets) nên chạy được dưới /vp/<phòng>/; riêng WebSocket gọi thẳng host/ws → viết lại.
    sub_filter 'window.location.host}/ws' 'window.location.host}/vp/$vp_phong/ws';
    sub_filter '</head>' '<script src="/vp/vp-chen.js"></script></head>';
    sub_filter_once off;
    sub_filter_types text/html application/javascript;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;   # pixel-agents kiểm Origin == Host
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location ~ ^/vp/[a-z0-9-]+$ { return 301 $uri/; }
  location / {
    proxy_pass http://127.0.0.1:3860;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

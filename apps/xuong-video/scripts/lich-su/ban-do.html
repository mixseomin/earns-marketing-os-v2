<!doctype html>
<!-- KÊNH LỊCH SỬ — MẪU DỰNG "BẢN ĐỒ + DÒNG THỜI GIAN" (02/11/2026, S08 bước 2). Hình là hàm thuần của t (window.__seek) → shot-code/dung.mjs quay từng khung.
     CAU do dung-tap.mjs dựng: {DAI, W, H, nen, geo:{iso:[[[lon,lat]…]…]}, tu:[{chu,a,b}] (mốc từng chữ của giọng), canh:[{bd,kt,chu,…cảnh trong tệp tập}]}.
     Một cảnh = một câu đọc: camera bay tới (tam, zoom), tô nước (to), nhãn, ghim, mũi tên quân (ten), điểm nháy, người phẳng, năm đếm, chữ to mở,
     phụ đề từng chữ sáng theo giọng, thẻ kết "PART 2". Nền = ảnh giấy cổ thật (luật nền ảnh thật). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@800;900&family=Anton&family=Bangers&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d'), W = 1080, H = 1920;
const io = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2), out = (k) => 1 - Math.pow(1 - k, 3), kep = (v) => Math.max(0, Math.min(1, v));
let C, nen, mien, dh, NV = {};
// THEME (kenh.json › theme, C.theme): giay = bản đồ giấy cổ (kênh Saga) · la_cai = báo lá cải cắt dán (kênh parody): màu gắt viền đen bóng cứng, nhân vật
// hình dán viền trắng lắc kiểu stop-motion, tít báo, con dấu hình nổ, tranh thành ảnh polaroid dán băng keo, kết bằng vòng tròn khép kiểu hoạt hình cũ
let LC = false, chamIn = null;
const FONT_TEN = () => (LC ? 'Anton, Impact, sans-serif' : 'Cinzel, Georgia, serif');
const nay_ = (k) => 1 + 2.70158 * (k - 1) ** 3 + 1.70158 * (k - 1) ** 2;   // vào có nảy quá rồi về (back-out)
const DAN = new Map();   // hình dán: viền đen mảnh + viền trắng dày quanh bóng người, dựng một lần mỗi ảnh
function hinhDan(img, key, h) { if (DAN.has(key)) return DAN.get(key);
  const sc = h / img.height, w = Math.round(img.width * sc), hh = Math.round(h), p = 18, cv = document.createElement('canvas'); cv.width = w + p * 2; cv.height = hh + p * 2;
  const bong = (mau) => { const b = document.createElement('canvas'); b.width = cv.width; b.height = cv.height; const g = b.getContext('2d'); g.drawImage(img, p, p, w, hh); g.globalCompositeOperation = 'source-in'; g.fillStyle = mau; g.fillRect(0, 0, b.width, b.height); return b; };
  const g = cv.getContext('2d'), den = bong('#111'), trang = bong('#fff');
  for (let a = 0; a < 24; a++) { const q = (a / 24) * 2 * Math.PI; g.drawImage(den, Math.cos(q) * 13, Math.sin(q) * 13); }
  for (let a = 0; a < 24; a++) { const q = (a / 24) * 2 * Math.PI; g.drawImage(trang, Math.cos(q) * 10, Math.sin(q) * 10); }
  g.drawImage(img, p, p, w, hh); DAN.set(key, cv); return cv; }
const no = (r, n = 14) => { x.beginPath(); for (let i = 0; i < n * 2; i++) { const g = (i / (n * 2)) * 2 * Math.PI, rr = i % 2 ? r * 0.7 : r * (0.92 + 0.08 * Math.sin(i * 7.3)); const px = Math.cos(g) * rr * 1.35, py = Math.sin(g) * rr; i ? x.lineTo(px, py) : x.moveTo(px, py); } x.closePath(); };
function chuDam(t, px, py, size, mau = '#fff', vien = '#111', font = 'Anton, Impact, sans-serif', can = 'center') {   // chữ lá cải: viền đen dày + bóng cứng lệch
  x.font = `400 ${size}px ${font}`; x.textAlign = can; x.textBaseline = 'middle'; x.lineJoin = 'round';
  x.lineWidth = size * 0.2; x.strokeStyle = vien; x.strokeText(t, px + size * 0.06, py + size * 0.07); x.fillStyle = vien; x.fillText(t, px + size * 0.06, py + size * 0.07);
  x.strokeText(t, px, py); x.fillStyle = mau; x.fillText(t, px, py); }
// Chiếu trụ đều, vĩ tuyến chuẩn theo vùng của tập (C.vi_tuyen do dung-tap.mjs tính từ các cảnh: Baltic 54°, Nam Mỹ ~-18°) — cùng lưới với ảnh địa hình
// Natural Earth; zoom 1 ≈ 1 độ vĩ = 12 px
let COS = Math.cos((54 * Math.PI) / 180);
let cam = { lon: 0, lat: 0, z: 1 }, rung = [0, 0];
const chieu = (lon, lat) => { const s = 12 * cam.z; return [W / 2 + (lon - cam.lon) * s * COS + rung[0], H * 0.42 - (lat - cam.lat) * s + rung[1]]; };

// NĂM TRƯỚC CÔNG NGUYÊN: tập ghi số âm (-1472) → hiện "1472 BC" (C.tcn theo ngôn ngữ tập: BC / a. C.), không bao giờ in dấu trừ
const chuNam = (n) => (n < 0 ? `${-n} ${C.tcn || 'BC'}` : String(n));
window.__dung = async () => {
  C = window.CAU; LC = C.theme === 'la_cai';
  if (LC) { const p = document.createElement('canvas'); p.width = p.height = 10; const g = p.getContext('2d'); g.fillStyle = '#2a2a2a'; g.beginPath(); g.arc(5, 5, 2.2, 0, 7); g.fill(); chamIn = x.createPattern(p, 'repeat'); }
  if (C.vi_tuyen != null) COS = Math.cos((C.vi_tuyen * Math.PI) / 180); nen = new Image(); nen.src = C.nen; await nen.decode();
  if (C.dia_hinh) { dh = new Image(); dh.src = C.dia_hinh.anh; await dh.decode(); }
  for (const [k, u] of Object.entries(C.nv || {})) { const i = new Image(); i.src = u; await i.decode(); NV[k] = i; }
  mien = {}; for (const [iso, polys] of Object.entries(C.geo)) mien[iso] = polys.map((ring) => ({ ring, bb: ring.reduce((b, [a, d]) => [Math.min(b[0], a), Math.min(b[1], d), Math.max(b[2], a), Math.max(b[3], d)], [999, 999, -999, -999]) }));
  await document.fonts.ready;
};
const vePoly = (ring) => { x.beginPath(); ring.forEach(([lo, la], i) => { const [px, py] = chieu(lo, la); i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.closePath(); };
const phan = (iso, vung) => (mien[iso] || []).filter((p) => !vung || (p.bb[2] >= vung[0] && p.bb[0] <= vung[2] && p.bb[3] >= vung[1] && p.bb[1] <= vung[3]));
function chuVien(t, px, py, size, mau = '#2b2116', vien = 'rgba(248,240,222,.95)', can = 'center', dam = 700, font = FONT_TEN()) {
  if (LC) { chuDam(t, px, py, size * 1.05, '#fff', '#111', font, can); return; }
  x.font = `${dam} ${size}px ${font}`; x.textAlign = can; x.textBaseline = 'middle'; x.lineJoin = 'round';
  x.lineWidth = size * 0.22; x.strokeStyle = vien; x.strokeText(t, px, py); x.fillStyle = mau; x.fillText(t, px, py);
}
function nguoi(px, py, mu, mau, ten, u) {   // người phẳng kiểu sách tranh: đầu tròn, thân áo choàng, nhún thở
  const b = Math.sin(u * 3) * 4, s = 1.6; x.save(); x.translate(px, py + b); x.scale(s, s);
  x.fillStyle = 'rgba(0,0,0,.18)'; x.beginPath(); x.ellipse(0, 46, 26, 6, 0, 0, 7); x.fill();
  x.fillStyle = mau; x.strokeStyle = '#2b2116'; x.lineWidth = 2.5; x.beginPath(); x.moveTo(-22, 44); x.quadraticCurveTo(-20, 2, 0, 0); x.quadraticCurveTo(20, 2, 22, 44); x.closePath(); x.fill(); x.stroke();
  x.fillStyle = '#f1d9b5'; x.beginPath(); x.arc(0, -14, 15, 0, 7); x.fill(); x.stroke();
  x.fillStyle = '#2b2116'; x.beginPath(); x.arc(-5, -15, 1.8, 0, 7); x.arc(5, -15, 1.8, 0, 7); x.fill();
  if (mu === 'vuong_mien') { x.fillStyle = '#e0b43a'; x.beginPath(); x.moveTo(-13, -26); x.lineTo(-13, -40); x.lineTo(-6, -32); x.lineTo(0, -42); x.lineTo(6, -32); x.lineTo(13, -40); x.lineTo(13, -26); x.closePath(); x.fill(); x.stroke(); }
  if (mu === 'mu_sat') { x.fillStyle = '#9aa0a6'; x.beginPath(); x.rect(-16, -34, 32, 22); x.fill(); x.stroke(); x.fillStyle = '#2b2116'; x.fillRect(-12, -22, 24, 3); x.strokeStyle = '#b02a22'; x.lineWidth = 3; x.beginPath(); x.moveTo(0, 6); x.lineTo(0, 34); x.moveTo(-10, 16); x.lineTo(10, 16); x.stroke(); }
  if (mu === 'mu_quan') { x.fillStyle = '#5a6b4a'; x.beginPath(); x.ellipse(0, -28, 19, 7, 0, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#b02a22'; x.beginPath(); x.arc(0, -29, 3, 0, 7); x.fill(); x.fillStyle = '#2b2116'; x.fillRect(-7, -8, 14, 3); }
  if (mu === 'toc_gia') { x.fillStyle = '#f2efe8'; x.beginPath(); x.arc(-13, -18, 7, 0, 7); x.arc(13, -18, 7, 0, 7); x.arc(0, -28, 9, 0, 7); x.fill(); x.stroke(); }
  x.restore(); if (ten) chuVien(ten, px, py + 112 + b, 30, '#2b2116');
}
/** đường cong từ a tới b (toạ độ màn) — MỘT đường cho mũi tên quân và phương tiện chạy theo nó */
const duong = (a, b) => { const [x0, y0] = chieu(...a), [x1, y1] = chieu(...b), mx = (x0 + x1) / 2 - (y1 - y0) * 0.25, my = (y0 + y1) / 2 + (x1 - x0) * 0.25;
  return (t) => [(1 - t) ** 2 * x0 + 2 * (1 - t) * t * mx + t * t * x1, (1 - t) ** 2 * y0 + 2 * (1 - t) * t * my + t * t * y1]; };
function muiTen(a, b, k, mau) {   // mũi tên quân vẽ dần
  const P = duong(a, b);
  x.save(); x.strokeStyle = mau; x.lineCap = 'round'; x.lineWidth = 22; x.globalAlpha = 0.95; x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 12;
  if (LC) { x.globalAlpha = 1; x.shadowColor = '#111'; x.shadowBlur = 0; x.shadowOffsetX = 7; x.shadowOffsetY = 8; }
  x.beginPath();
  // ĐỈNH mũi nhọn chạm đúng điểm đích (tâm vùng) — thân dừng trước đỉnh một khoảng bằng mũi, không vượt ra ngoài đối tượng
  const [ex, ey] = P(k), [fx, fy] = P(Math.max(0, k - 0.02)), g = Math.atan2(ey - fy, ex - fx), MUI = 46;
  const ket = Math.max(0, k - MUI / Math.max(1, Math.hypot(ex - P(0)[0], ey - P(0)[1])));
  for (let i = 0; i <= 40; i++) { const t = (i / 40) * ket, [px, py] = P(t); i ? x.lineTo(px, py) : x.moveTo(px, py); }
  if (LC) { const m = x.strokeStyle; x.strokeStyle = '#111'; x.lineWidth = 36; x.stroke(); x.shadowColor = 'transparent'; x.strokeStyle = m; x.lineWidth = 22; } x.stroke();
  if (k > 0.05) { x.fillStyle = mau; x.translate(ex, ey); x.rotate(g); x.beginPath(); x.moveTo(0, 0); x.lineTo(-MUI, -30); x.lineTo(-MUI, 30); x.closePath(); x.fill(); if (LC) { x.strokeStyle = '#111'; x.lineWidth = 7; x.stroke(); } }
  x.restore();
}

window.__seek = (t) => {
  const ds = C.canh; let k = ds.findIndex((s) => t < s.kt); if (k < 0) k = ds.length - 1;
  const s = ds[k], tr = ds[k - 1], u = t - s.bd;
  // camera bay từ cảnh trước tới cảnh này (zoom theo log để bay đều). HOOK (cảnh đầu khai mo): lao từ trên cao xuống điểm lạ.
  // NHẢY XA: hai vùng cách xa thì vút lên nhìn rộng giữa đường rồi lao xuống (kiểu Google Earth) — khán giả không mất phương hướng.
  const a = tr ? tr.c : s.c.mo ? { tam: s.c.mo.tu_tam, zoom: s.c.mo.tu_zoom } : s.c;
  const xa = Math.hypot((s.c.tam[0] - a.tam[0]) * COS, s.c.tam[1] - a.tam[1]), lau = !tr && s.c.mo ? 1.4 : xa > 6 ? 1.6 : 1.1, bay = kep(u / lau);
  const e = !tr && s.c.mo ? (bay < 1 ? 1 - Math.pow(2, -10 * bay) : 1) : io(bay), vut = xa > 6 && tr ? Math.min(2.6, xa / 7) * Math.sin(Math.PI * bay) : 0;
  cam = { lon: a.tam[0] + (s.c.tam[0] - a.tam[0]) * e, lat: a.tam[1] + (s.c.tam[1] - a.tam[1]) * e, z: Math.exp(Math.log(a.zoom) + (Math.log(s.c.zoom) - Math.log(a.zoom)) * e) / (1 + vut) * (1 + 0.012 * u) };
  // CÂU ĐÙA (câu không su_that, kênh parody): camera dập vào 12 % đúng lúc câu bắt đầu — nhịp hài kiểu phóng sự
  if (LC && s.c._dua) cam.z *= 1 + 0.12 * out(kep((u - 0.12) / 0.14));
  // camera không ra ngoài ảnh địa hình: zoom tối thiểu để khung lọt trong vùng ảnh, rồi kẹp tâm (không lộ viền tối)
  if (C.dia_hinh) { const [l0, l1] = C.dia_hinh.lon, [b0, b1] = C.dia_hinh.lat; cam.z = Math.max(cam.z, H / (12 * (b1 - b0)) * 1.02, W / (12 * COS * (l1 - l0)) * 1.02);
    const nb = (H * 0.42) / (12 * cam.z), nd = (H * 0.58) / (12 * cam.z), nn = W / 2 / (12 * cam.z * COS);
    cam.lat = Math.min(b1 - nb, Math.max(b0 + nd, cam.lat)); cam.lon = Math.min(l1 - nn, Math.max(l0 + nn, cam.lon)); }
  // nền giấy thật (phủ kín, trôi nhẹ)
  rung = [0, 0]; for (const d of s.c.dau || []) { const q = u - d.t; if (q > 0 && q < 0.35) { const a = 14 * (1 - q / 0.35); rung = [a * Math.sin(q * 90), a * Math.cos(q * 77)]; } }
  x.fillStyle = '#3d4f58'; x.fillRect(0, 0, W, H);
  if (dh) { const [x0, y0] = chieu(C.dia_hinh.lon[0], C.dia_hinh.lat[1]), [x1, y1] = chieu(C.dia_hinh.lon[1], C.dia_hinh.lat[0]); if (LC) x.filter = 'saturate(1.7) contrast(1.15) brightness(1.06)'; x.drawImage(dh, x0, y0, x1 - x0, y1 - y0); x.filter = 'none'; }
  // tông giấy cổ: ngả sepia + vân giấy thật nhân lên (multiply) — địa hình vẫn đọc được. Lá cải: giấy báo ngà nhẹ + chấm in
  if (LC) { x.save(); x.globalCompositeOperation = 'multiply'; x.fillStyle = 'rgba(255,244,214,.6)'; x.fillRect(0, 0, W, H); x.globalAlpha = 0.1; x.fillStyle = chamIn; x.fillRect(0, 0, W, H); x.restore(); }
  else { x.save(); x.globalCompositeOperation = 'color'; x.fillStyle = 'rgba(176,140,90,.55)'; x.fillRect(0, 0, W, H); x.restore(); }
  if (!LC) { x.save(); x.globalCompositeOperation = 'multiply'; x.globalAlpha = 0.55; const sc = Math.max(W / nen.width, H / nen.height) * 1.06; x.drawImage(nen, (W - nen.width * sc) / 2 - u * 2, (H - nen.height * sc) / 2, nen.width * sc, nen.height * sc); x.restore(); }
  // TÔNG THEO THỜI: trung cổ ngả nâu cũ, thế kỷ 20 lạnh hơn
  { const nm = s.c.nam_sau && u >= s.c.nam_sau[0] ? s.c.nam_sau[1] : (s.c.nam ?? tr?.c.nam ?? 1900);
    if (LC) {} else if (nm < 1600) { x.save(); x.globalCompositeOperation = 'multiply'; x.fillStyle = 'rgba(190,150,100,.22)'; x.fillRect(0, 0, W, H); x.restore(); }
    else if (nm >= 1900) { x.save(); x.globalCompositeOperation = 'soft-light'; x.fillStyle = 'rgba(70,100,140,.28)'; x.fillRect(0, 0, W, H); x.restore(); } }
  // biên giới mảnh, mực nâu
  x.lineJoin = 'round';
  for (const ps of Object.values(mien)) for (const p of ps) { vePoly(p.ring); x.strokeStyle = LC ? 'rgba(17,17,17,.75)' : 'rgba(70,50,30,.55)'; x.lineWidth = LC ? 2.2 : 1.4; x.stroke(); }
  // tô nước của cảnh: hiện dần; nước cảnh trước còn tô mà cảnh này không tô thì nhạt dần
  const toMau = (sc_) => (sc_?.c.to || []).flatMap((o) => [].concat(o.iso).map((iso) => ({ iso, vung: o.vung, mau: o.mau })));
  const cu = tr ? toMau(tr) : [], moi = toMau(s), khoa = (o) => `${o.iso}|${o.vung}|${o.mau}`;
  const ve = (o, al) => { if (al <= 0) return; for (const p of phan(o.iso, o.vung)) {
    if (LC) { x.save(); x.translate(9, 11); vePoly(p.ring); x.globalAlpha = al * 0.4; x.fillStyle = '#111'; x.fill(); x.restore();
      vePoly(p.ring); x.globalAlpha = al * 0.88; x.fillStyle = o.mau; x.fill(); x.globalAlpha = al; x.strokeStyle = '#111'; x.lineWidth = 6; x.stroke(); x.globalAlpha = 1; continue; }
    x.save(); vePoly(p.ring); x.shadowColor = o.mau; x.shadowBlur = 40; x.globalAlpha = al * 0.62; x.fillStyle = o.mau; x.fill(); x.restore();
    x.save(); vePoly(p.ring); x.clip(); vePoly(p.ring); x.globalAlpha = al; x.strokeStyle = 'rgba(255,245,220,.55)'; x.lineWidth = 14; x.stroke(); x.restore();   // ánh sáng mép trong
    vePoly(p.ring); x.globalAlpha = al; x.strokeStyle = '#2b1d10'; x.lineWidth = 4; x.stroke(); x.globalAlpha = 1; } };
  for (const o of cu) if (!moi.some((m) => khoa(m) === khoa(o))) ve(o, 0.78 * (1 - kep(u / 0.6)));
  for (const o of moi) ve(o, 0.78 * (cu.some((m) => khoa(m) === khoa(o)) ? 1 : kep((u - 0.2) / 0.6)));
  // NHẮC TÊN LÀ SÁNG: nước được đọc tên lóe sáng rồi tắt hẳn sau ~3 s (không đè màu riêng của cảnh), viền vàng nhấp nháy, nhãn tên bật ra ở tâm nước
  for (const g of s.c.goi || []) { const q = u - g.t; if (q < 0 || q > 3.2) continue; const loe = Math.exp(-q * 2.2), al = (0.2 + 0.55 * loe) * kep((3.2 - q) / 0.8);
    for (const iso of g.iso) for (const p of phan(iso)) { x.save(); vePoly(p.ring); x.globalAlpha = al; x.fillStyle = LC ? '#ffe14d' : '#e6b23a'; if (!LC) { x.shadowColor = '#ffd36a'; x.shadowBlur = 50 * loe + 8; } x.fill(); x.restore();
      vePoly(p.ring); x.strokeStyle = LC ? `rgba(17,17,17,${kep((3.2 - q) / 0.8)})` : `rgba(255,214,90,${(0.5 + 0.5 * loe) * kep((3.2 - q) / 0.8)})`; x.lineWidth = LC ? 7 : 3 + 5 * loe; x.stroke(); }
    if (g.o && q < 2.4) { const [px, py] = chieu(...g.o), pop = q < 0.25 ? 0.6 + 0.55 * out(q / 0.25) : 1 + 0.15 * Math.max(0, 1 - (q - 0.25) / 0.2); x.save(); x.globalAlpha = kep((2.4 - q) / 0.4); x.translate(px, py); x.scale(pop, pop); if (LC) { x.rotate(-0.05); chuDam(g.ten.toUpperCase(), 0, 0, 70, '#ffe14d'); } else chuVien(g.ten.toUpperCase(), 0, 0, 52, '#5a2a08', 'rgba(255,240,200,.97)'); x.restore(); } }
  for (const c of s.c.tp || []) { const q = u - c.t; if (q < 0) continue; const [px, py] = chieu(...c.o);
    for (let i = 0; i < 2; i++) { const r = ((q * 0.8 + i * 0.5) % 1); x.strokeStyle = `rgba(43,29,16,${(1 - r) * 0.8})`; x.lineWidth = 4; x.beginPath(); x.arc(px, py, 10 + r * 60, 0, 7); x.stroke(); }
    x.fillStyle = '#2b1d10'; x.beginPath(); x.arc(px, py, 11, 0, 7); x.fill(); x.fillStyle = '#f0dcae'; x.beginPath(); x.arc(px, py, 5, 0, 7); x.fill();
    x.globalAlpha = kep(q / 0.3); chuVien(c.ten, px, py - 44, 42, '#2b1d10'); x.globalAlpha = 1; }
  // mũi tên quân
  for (const m of s.c.ten || []) muiTen(m.tu, m.den, out(kep((u - 0.4) / 1.4)), m.mau);

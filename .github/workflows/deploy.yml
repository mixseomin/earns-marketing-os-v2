name: Deploy MOS v2

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'wiki/**'
      - 'decisions/**'
      - '.gitignore'
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Build on GitHub-hosted runner (7GB RAM, clean) instead of as.on.tc self-hosted
# (CX22 4GB, swap-thrashing → next build OOM SIGKILL → wiped .next/static/, served
# HTML referencing dead CSS hashes; incident 2026-06-28). Server still runs migrations,
# deps install, and `next start` — only the build moved.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # cần lịch sử để so before..sha khi chọn app phải build
      # Chỉ build app có thay đổi (anh chốt 11/10/2026): lượt chỉ sửa cty từ ~4 phút còn ~1,5 phút. Không xác định được khoảng
      # thay đổi (nhánh mới, chạy tay, đổi chính workflow) → build HẾT. web = mọi thay đổi nằm ngoài 3 app con (packages, scripts,
      # deploy.sh, lockfile…) — khớp điều kiện WEB_CHANGED/DEPS_CHANGED của deploy.sh nên box không bao giờ phải tự build web.
      - name: Chọn app cần build
        id: chon
        run: |
          B="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$B" ] || [ "$B" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$B^{commit}" 2>/dev/null; then
            F="__HET__"
          else
            F=$(git diff --name-only "$B" "${{ github.sha }}")
            echo "$F" | grep -q '^\.github/workflows/' && F="__HET__"
          fi
          co() { [ "$F" = "__HET__" ] || echo "$F" | grep -qE "$1"; }
          co '^(apps/store/|packages/(shop|db)/|package-lock\.json)' && echo "store=1" >> "$GITHUB_OUTPUT"
          co '^(apps/xuong-video/|packages/(db|gop-y)/|package-lock\.json)' && echo "studio=1" >> "$GITHUB_OUTPUT"
          co '^(apps/cty/|packages/(db|gop-y)/|package-lock\.json)' && echo "cty=1" >> "$GITHUB_OUTPUT"
          if [ "$F" = "__HET__" ] || echo "$F" | grep -vqE '^(apps/(store|xuong-video|cty)/|packages/gop-y/)'; then echo "web=1" >> "$GITHUB_OUTPUT"; fi
          echo "Tệp đổi:"; echo "$F" | head -40; echo "Build:"; cat "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }   # match server node v22 (.next swapped in raw) + Node 20 is GHA-deprecated
      # Restore Next.js incremental build cache — without it every CI build is COLD and grows with the
      # app (the "deploy keeps getting slower"). Keyed per-sha, restore-keys falls back to the newest.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextcache-${{ github.sha }}
          restore-keys: nextcache-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: node scripts/check-sql-aliases.mjs
      - run: node scripts/check-canon.mjs
      - run: node scripts/check-gop-y-surface.mjs
      - run: node scripts/check-mos2-host.mjs --tu-kiem && node scripts/check-mos2-host.mjs
      - run: node scripts/check-tab-trang.mjs --tu-kiem && node scripts/check-tab-trang.mjs
      - run: node scripts/check-client-db.mjs --tu-kiem && node scripts/check-client-db.mjs
      - run: npm run build:web
        if: steps.chon.outputs.web == '1'
      # Mặt tiền shop (apps/store, một bản dựng cho mọi tên miền shop) — dựng cùng lượt, máy chủ chỉ đổi khi phần của nó đổi.
      - run: npm run build --workspace=apps/store
        if: steps.chon.outputs.store == '1'
      - run: tar -C apps/store --exclude='.next/cache' -czf store.tar.gz .next
        if: steps.chon.outputs.store == '1'
      # Xưởng video (apps/xuong-video → studio.on.tc): app riêng, dựng cùng lượt, máy chủ chỉ đổi khi phần của nó đổi (deploy.sh 5c).
      - run: npm run build --workspace=apps/xuong-video
        if: steps.chon.outputs.studio == '1'
      - run: tar -C apps/xuong-video --exclude='.next/cache' -czf studio.tar.gz .next
        if: steps.chon.outputs.studio == '1'
      # Công ty AI (apps/cty → cty.on.tc): hồ sơ phòng/nhân sự tự kiểm trước, dựng cùng lượt, máy chủ chỉ đổi khi phần của nó đổi (deploy.sh 5e).
      - run: node apps/cty/scripts/tu-kiem.mjs && node apps/cty/scripts/fm.mjs --tu-kiem && node apps/cty/worker/log.mjs --tu-kiem && node apps/cty/worker/proxy.mjs --tu-kiem && node apps/cty/worker/ca.mjs --tu-kiem && node apps/cty/scripts/thu-ngan.mjs && node apps/cty/worker/quy-trinh.mjs --tu-kiem && node apps/cty/worker/cai-tien.mjs --tu-kiem
        if: steps.chon.outputs.cty == '1'
      - run: npm run build --workspace=apps/cty
        if: steps.chon.outputs.cty == '1'
      - run: tar -C apps/cty --exclude='.next/cache' -czf cty.tar.gz .next
        if: steps.chon.outputs.cty == '1'
      # Tar so scp transfers one file (faster + atomic on receive). EXCLUDE .next/cache — it's build-time
      # only (next start never reads it), it's cached separately above, and shipping it bloats the artifact.
      - run: tar -C apps/web --exclude='.next/cache' -czf next.tar.gz .next
        if: steps.chon.outputs.web == '1'
      - uses: actions/upload-artifact@v4
        with: { name: next-build, path: "next.tar.gz\nstore.tar.gz\nstudio.tar.gz\ncty.tar.gz", retention-days: 1, if-no-files-found: error }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { name: next-build }
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: Ship build artifact
        run: |
          ls -la *.tar.gz
          scp -i ~/.ssh/id_ed25519 *.tar.gz root@${{ secrets.DEPLOY_HOST }}:/tmp/
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.DEPLOY_HOST }} '
            set -e
            bung() {   # app tarball — chỉ app được build lượt này mới có tarball; app không build giữ nguyên bản đang chạy
              [ -f "/tmp/$2" ] || { echo "↺ $1: không build lượt này"; return 0; }
              mkdir -p "/opt/earns-marketing-os-v2/apps/$1" && cd "/opt/earns-marketing-os-v2/apps/$1"
              rm -rf .next.new "/tmp/b-$1" && mkdir -p .next.new "/tmp/b-$1"
              tar -xzf "/tmp/$2" -C "/tmp/b-$1/"
              mv "/tmp/b-$1/.next/"* .next.new/
              rm -rf "/tmp/b-$1" "/tmp/$2"
              echo "✓ $1: đã gửi bản mới"
            }
            bung web next.tar.gz
            bung store store.tar.gz
            bung xuong-video studio.tar.gz
            bung cty cty.tar.gz
          '
      - name: Run server-side deploy (migrations + swap + restart)
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.DEPLOY_HOST }} 'SKIP_BUILD=1 /opt/earns-marketing-os-v2/deploy.sh'

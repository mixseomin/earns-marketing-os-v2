# outreach.on.tc — hệ thống outreach nhiều dự án (anh 20/11/2026). KHÔNG có tiến trình riêng: cùng app mos2-web (cổng 3821), cùng phiên .on.tc;
# middleware của app (apps/web/src/middleware.ts, OUTREACH_HOST) đưa gốc của host này về trang /outreach. deploy.sh khối 5e4 cài tệp này vào
# sites-enabled/outreach.on.tc; DNS do deploy/dns-on-tc.sh tự tạo. Chứng chỉ: bản wildcard on.tc như các sub khác (studio2, castle).
server { listen 80; server_name outreach.on.tc; return 301 https://$host$request_uri; }
server {
  listen 443 ssl; http2 on;
  server_name outreach.on.tc;
  include snippets/cloudflare-allow.conf;
  ssl_certificate /etc/letsencrypt/live/on.tc/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/on.tc/privkey.pem;
  add_header X-Robots-Tag "noindex, nofollow" always;
  include /opt/earns-marketing-os-v2/deploy/nginx-dang-cap-nhat.conf;   # deploy không ra 502
  location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
  location / {
    proxy_pass http://127.0.0.1:3821;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

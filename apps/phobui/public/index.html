  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</script>

<body>
<canvas id="c"></canvas>
<div id="nap">Đang dựng thành phố…</div>
<header class="bang tren">
  <h1>Phố Bụi <small>bay qua thành phố dưới bầu trời cháy</small></h1>
</header>
<aside class="bang ben">
  <div class="nut">
    <button id="tuBay" class="on" title="Máy quay tự lượn qua thành phố; chạm điều khiển là tắt">🎥 Tự bay</button>
    <button id="toc" title="Tốc độ bay">Tốc độ 1×</button>
  </div>
  <label>Bụi <b id="vBui">70%</b><input id="bui" type="range" min="0" max="100" value="70"></label>
  <p class="goiy">Kéo chuột để nhìn quanh. <b>W A S D</b> hoặc phím mũi tên để bay, <b>Space</b> lên, <b>C</b> xuống, giữ <b>Shift</b> bay nhanh. Lăn chuột đổi tốc độ.</p>
</aside>
<div class="phim">
  <button data-k="len">▲ Lên</button>
  <button data-k="tien">Tiến</button>
  <button data-k="lui">Lùi</button>
  <button data-k="xuong">▼ Xuống</button>
</div>
<script type="module" src="phobui.js?v=__BAN__"></script>
</body>

# studio.on.tc — Xưởng video AI (apps/xuong-video :3840, mos2-studio.service). Vhost RIÊNG: sập cái này không kéo mos2.on.tc theo.
# Cert wildcard on.tc dùng chung; Cloudflare đứng trước (DNS *.on.tc đã trỏ sẵn). deploy.sh cài file này vào sites-enabled/studio.on.tc.
server { listen 80; server_name studio.on.tc; return 301 https://$host$request_uri; }
server {
  listen 443 ssl; http2 on;
  server_name studio.on.tc;
  include snippets/cloudflare-allow.conf;
  ssl_certificate /etc/letsencrypt/live/on.tc/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/on.tc/privkey.pem;
  client_max_body_size 30m;
  location / {
    proxy_pass http://127.0.0.1:3840;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;   # server action tách cảnh / sinh ảnh có thể chạy vài chục giây
  }
}
